<!doctype html>
<html lang="ko" data-theme="dark" data-skin="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>LAMDice · 모바일 채팅 목업</title>
  <script src="/js/shared/theme-shared.js"></script>
  <script src="/mockups/horse-mobile-theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="/mockups/horse-mobile-theme.css">
  <style>
    /* 독립 채팅 목업. 메시지 전송·반응은 이 화면 안에서만 동작한다. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--mobile-canvas); color: var(--mobile-ink); font: 500 14px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; }
    button,textarea { font: inherit; color: inherit; }
    button,a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid var(--mock-emphasis); outline-offset: 3px; }
    h1,h2,p { margin: 0; }
    img { display: block; object-fit: contain; image-rendering: pixelated; }
    .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #mockBar { min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 10px; background: var(--mobile-card); color: var(--mobile-muted); border-bottom: 1px solid var(--mobile-line); font-size: 11px; }
    #mockBar button { min-height: 28px; padding: 3px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--mobile-ink); font-size: 11px; }
    #mockBar button[aria-pressed="true"] { background: var(--mobile-soft); }
    .prototype { max-width: 430px; height: calc(100dvh - 37px); margin: auto; display: flex; flex-direction: column; background: var(--mobile-canvas); }
    .room-head { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; border-bottom: 1px solid var(--mobile-line); flex: none; }
    .icon-button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 1px solid var(--mobile-line); border-radius: 12px; background: var(--mobile-card); color: var(--mobile-ink); text-decoration: none; flex: none; }
    .identity { flex: 1; min-width: 0; }
    .identity small { color: var(--mobile-muted); font-size: 11px; }
    .identity h1 { font-size: 17px; font-weight: 750; letter-spacing: -.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .people-button { width: auto; padding: 0 11px; font-size: 13px; font-weight: 700; }
    .content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin: 12px 16px 10px; flex: none; }
    .chat-head h2 { font-size: 24px; letter-spacing: -.8px; }
    .online { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--mobile-muted); }
    .online::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mock-emphasis); }
    .ad { min-height: 54px; margin: 0 16px 4px; border: 1px dashed var(--mobile-line); border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--mobile-muted); font-size: 10px; letter-spacing: 1px; }
    .chat-log { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 12px 16px 16px; }
    .date { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--mobile-muted); font-size: 10px; margin: 0 0 16px; }
    .date::before,.date::after { content: ''; height: 1px; background: var(--mobile-line); width: 30px; }
    .message { display: flex; gap: 8px; margin-bottom: 14px; }
    .message:last-child { margin-bottom: 0; }
    .avatar { width: 30px; height: 32px; display: grid; place-items: center; flex: none; margin-top: 1px; border-radius: 9px; background: var(--mobile-soft); }
    .avatar img { width: 28px; height: 26px; }
    .message-body { min-width: 0; max-width: calc(100% - 38px); }
    .sender { display: flex; align-items: center; gap: 5px; min-height: 16px; margin-bottom: 5px; font-size: 11px; font-weight: 650; }
    .sender small { color: var(--mobile-muted); font-size: 10px; font-weight: 500; }
    .bubble-line { display: flex; align-items: flex-end; gap: 6px; }
    .bubble { min-width: 0; padding: 10px 12px; border: 1px solid var(--mobile-line); border-radius: 2px 14px 14px; background: var(--mobile-card); font-size: 14px; font-weight: 500; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; }
    .stamp { display: block; flex: none; margin-bottom: 1px; color: var(--mobile-muted); font-size: 10px; font-variant-numeric: tabular-nums; line-height: 1.4; }
    .message.mine { justify-content: flex-end; margin-block: 18px; }
    .mine .message-body { max-width: 88%; }
    .mine .bubble-line { flex-direction: row-reverse; }
    .mine .bubble { background: var(--mobile-soft); border-color: transparent; border-radius: 14px 2px 14px 14px; }
    .mine .sender { justify-content: flex-end; color: var(--mobile-muted); }
    .reaction { min-height: 44px; min-width: 44px; margin-top: 4px; padding: 0 9px; border: 1px solid var(--mobile-line); border-radius: 12px; background: var(--mobile-card); color: var(--mobile-muted); font-size: 12px; }
    .reaction[aria-pressed="true"] { background: var(--mobile-soft); border-color: var(--mock-emphasis); color: var(--mock-emphasis); }
    .empty { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--mobile-muted); font-size: 13px; }
    .empty .icon { width: 32px; height: 32px; }
    .composer { display: flex; align-items: flex-end; gap: 7px; padding: 10px 16px 12px; border-top: 1px solid var(--mobile-line); background: var(--mobile-canvas); flex: none; }
    .composer .icon-button { border: 0; background: var(--mobile-soft); }
    .composer textarea { display: block; width: 100%; min-width: 0; flex: 1; height: 44px; max-height: 120px; resize: none; padding: 9px 11px; border: 1px solid var(--mobile-line); border-radius: 12px; background: var(--mobile-card); font-size: 16px; line-height: 24px; }
    .composer textarea::placeholder { color: var(--mobile-muted); }
    .composer .send { background: var(--mobile-accent); color: var(--mobile-on-accent); }
    .composer .send .icon { width: 19px; height: 19px; }
    .footer { flex: none; padding: 8px 12px max(8px,env(safe-area-inset-bottom)); border-top: 1px solid var(--mobile-line); background: var(--mobile-canvas); }
    .dock { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .dock button,.dock a { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: transparent; color: var(--mobile-muted); font-size: 10px; text-decoration: none; }
    .dock img,.dock .icon { width: 19px; height: 19px; }
    .dock button[aria-current="page"] { background: var(--mobile-soft); color: var(--mobile-ink); font-weight: 750; }
    dialog { width: min(398px,calc(100% - 24px)); max-height: calc(100dvh - 36px); margin: auto auto 12px; padding: 20px; border: 1px solid var(--mobile-line); border-radius: 20px; background: var(--mobile-card); color: var(--mobile-ink); overflow: auto; }
    dialog::backdrop { background: rgba(var(--shadow-rgb),.65); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .dialog-head h2 { font-size: 20px; letter-spacing: -.6px; }
    .dialog-head .icon-button { border: 0; background: var(--mobile-soft); }
    .emoji-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 5px; }
    .emoji-grid button { min-width: 0; min-height: 48px; padding: 0; border: 0; border-radius: 10px; background: var(--mobile-soft); font-size: 23px; }
    .person-row { display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid var(--mobile-line); }
    .person-row:last-child { border-bottom: 0; }
    .person-row img { width: 35px; height: 32px; }
    .person-row span { flex: 1; }
    .person-row small,.dialog-copy { color: var(--mobile-muted); }
    .person-row small { font-size: 11px; }
    .dialog-copy { font-size: 14px; line-height: 1.7; }
    @media(min-width:600px) { .prototype { border-inline: 1px solid var(--mobile-line); } }
    @media(max-width:350px) { .room-head { gap: 8px; padding-inline: 12px; } .identity h1 { font-size: 15px; } .chat-head { margin-inline: 12px; } .ad { margin-inline: 12px; } .chat-log { padding-inline: 12px; } .composer { gap: 6px; padding-inline: 12px; } .bubble { padding: 9px 10px; } dialog { padding: 16px; } .emoji-grid { grid-template-columns: repeat(3,1fr); } }
    @media(max-height:600px) { .ad { display: none; } .chat-head { min-height: 36px; margin-block: 6px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation: none !important; transition: none !important; } button:active:not(:disabled) { transform: none; } }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 11h.01M11 11h.01M15 11h.01"/></symbol>
    <symbol id="i-cup" viewBox="0 0 24 24"><path d="M5 8h12v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4ZM17 9h2a3 3 0 0 1 0 6h-2M8 3v2m4-3v3m4-2v2"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14a4 4 0 0 0 8 0M8 9h.01M16 9h.01"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 20V4M5 11l7-7 7 7"/></symbol>
  </defs></svg>
  <div id="mockBar"><span>목업 · 채팅</span><button id="themeToggle">테마</button><button id="emptyToggle" aria-pressed="false">빈 화면</button></div>
  <div class="prototype">
    <header class="room-head"><a class="icon-button" href="/mockups/horse-ready-mobile.html" data-mock-page="ready" aria-label="게임으로 돌아가기"><svg class="icon"><use href="#i-back"/></svg></a><div class="identity"><small>경마 · 준비 중</small><h1>점심 먹고 한 판</h1></div><button class="icon-button people-button" id="peopleButton" aria-label="참여자 4명 보기"><svg class="icon"><use href="#i-people"/></svg>4</button></header>
    <main class="content">
      <div class="chat-head"><h2 id="chatTitle">채팅</h2><span class="online">4명 접속</span></div>
      <aside class="ad" aria-label="광고 자리">AD</aside>
      <div class="chat-log" id="chatLog" role="log" aria-labelledby="chatTitle" aria-live="polite" aria-relevant="additions"></div>
      <form class="composer" id="messageForm"><button class="icon-button" type="button" id="emojiButton" aria-label="이모지 선택"><svg class="icon" aria-hidden="true"><use href="#i-smile"/></svg></button><textarea id="messageInput" rows="1" maxlength="500" aria-label="메시지" placeholder="메시지 입력"></textarea><button class="icon-button send" id="sendButton" type="submit" aria-label="메시지 보내기" disabled><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button></form>
    </main>
    <footer class="footer"><nav class="dock" aria-label="방 메뉴"><a href="/mockups/horse-ready-mobile.html" data-mock-page="ready"><img src="/mockups/assets/ic-play.png" alt="">게임</a><a href="/mockups/horse-orders-mobile.html" data-mock-page="orders"><svg class="icon" aria-hidden="true"><use href="#i-cup"/></svg>주문</a><button id="chatTab" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg>채팅</button><button id="menuButton" data-mock-page="menu"><img src="/mockups/assets/ic-gamepad.png" alt="">메뉴</button></nav></footer>
  </div>
  <dialog id="emojiDialog" aria-labelledby="emojiTitle"><div class="dialog-head"><h2 id="emojiTitle">이모지</h2><button class="icon-button" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="emoji-grid" id="emojiGrid"></div></dialog>
  <dialog id="peopleDialog" aria-labelledby="peopleTitle"><div class="dialog-head"><h2 id="peopleTitle">참여자 4</h2><button class="icon-button" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="peopleList"></div></dialog>
  <script>
    'use strict';
    const PEOPLE = [{name:'나',vehicle:'dinosaur'},{name:'민지',vehicle:'ninja'},{name:'준호',vehicle:'crab',spectator:true},{name:'수빈',vehicle:'rabbit'}];
    const MESSAGES = [{person:1,text:'오늘은 3등 어때요? 👀',time:'12:42'},{person:2,text:'좋아요! 저는 라떼로 ☕',time:'12:42',reaction:true},{person:0,text:'난 아아! 주문도 적어놨어요',time:'12:43'},{person:3,text:'나도 주문하고 바로 준비할게요 🐰',time:'12:43'}];
    const EMOJIS = [['😊','웃음'],['👍','따봉'],['❤️','하트'],['😂','즐거움'],['☕','커피'],['🐎','말']];
    const INPUT_MIN_HEIGHT = 44, INPUT_MAX_HEIGHT = 120, MESSAGE_LIMIT = 500;
    const $ = id => document.getElementById(id);
    function node(tag,cls,text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text !== undefined) el.textContent = text; return el; }
    function sprite(vehicle) { const image = node('img'); image.src = '/assets/horse-race/vehicles/' + vehicle + '/base-idle-1.webp'; image.alt = ''; return image; }
    function messageRow(message) {
      const person = PEOPLE[message.person], mine = message.person === 0, row = node('article',mine ? 'message mine' : 'message'), body = node('div','message-body'), sender = node('p','sender',person.name), line = node('div','bubble-line'), bubble = node('p','bubble',message.text), stamp = node('time','stamp',message.time);
      row.setAttribute('aria-label',person.name + '의 메시지');
      if (!mine) { const avatar = node('div','avatar'); avatar.append(sprite(person.vehicle)); row.append(avatar); }
      if (person.spectator) sender.append(node('small','','관전자'));
      line.append(bubble,stamp); body.append(sender,line);
      if (message.reaction) { const reaction = node('button','reaction','👍 1'); reaction.setAttribute('aria-label','따봉 반응 1개, 반응하기'); reaction.setAttribute('aria-pressed','false'); reaction.addEventListener('click',() => { const active = reaction.getAttribute('aria-pressed') !== 'true'; reaction.setAttribute('aria-pressed',String(active)); reaction.textContent = active ? '👍 2' : '👍 1'; reaction.setAttribute('aria-label',active ? '따봉 반응 2개, 내 반응 취소' : '따봉 반응 1개, 반응하기'); }); body.append(reaction); }
      row.append(body); return row;
    }
    function scrollLatest() { $('chatLog').scrollTop = $('chatLog').scrollHeight; }
    function renderChat(empty = false) { $('chatLog').replaceChildren(); if (empty) { const blank = node('div','empty'), icon = document.createElementNS('http://www.w3.org/2000/svg','svg'), use = document.createElementNS('http://www.w3.org/2000/svg','use'); icon.setAttribute('class','icon'); icon.setAttribute('aria-hidden','true'); use.setAttribute('href','#i-chat'); icon.append(use); blank.append(icon,node('p','','첫 인사를 건네보세요')); $('chatLog').append(blank); return; } $('chatLog').append(node('p','date','오늘')); MESSAGES.forEach(m => $('chatLog').append(messageRow(m))); scrollLatest(); }
    function syncInput() { const input = $('messageInput'); input.style.height = INPUT_MIN_HEIGHT + 'px'; input.style.height = Math.min(INPUT_MAX_HEIGHT,Math.max(INPUT_MIN_HEIGHT,input.scrollHeight + 2)) + 'px'; $('sendButton').disabled = !input.value.trim(); }
    $('messageInput').addEventListener('input',syncInput);
    $('messageForm').addEventListener('submit',e => { e.preventDefault(); const text = $('messageInput').value.trim().slice(0,MESSAGE_LIMIT); if (!text) return; if ($('chatLog').querySelector('.empty')) $('chatLog').replaceChildren(node('p','date','오늘')); const time = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}); $('chatLog').append(messageRow({person:0,text,time})); $('messageInput').value = ''; syncInput(); scrollLatest(); $('messageInput').focus(); });
    EMOJIS.forEach(([emoji,label]) => { const button = node('button','',emoji); button.setAttribute('aria-label',label + ' 넣기'); button.addEventListener('click',() => { const input = $('messageInput'), start = input.selectionStart, end = input.selectionEnd, value = input.value.slice(0,start) + emoji + input.value.slice(end); if (value.length <= MESSAGE_LIMIT) { input.value = value; input.setSelectionRange(start + emoji.length,start + emoji.length); } $('emojiDialog').close(); syncInput(); input.focus(); }); $('emojiGrid').append(button); });
    $('emojiButton').addEventListener('click',() => $('emojiDialog').showModal());
    $('peopleButton').addEventListener('click',() => { $('peopleList').replaceChildren(); PEOPLE.forEach(p => { const row = node('div','person-row'); row.append(sprite(p.vehicle),node('span','',p.name + (p.spectator ? ' · 관전자' : '')),node('small','','접속 중')); $('peopleList').append(row); }); $('peopleDialog').showModal(); });
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click',() => b.closest('dialog').close()));
    document.querySelectorAll('dialog').forEach(d => d.addEventListener('click',e => { if (e.target !== d) return; const r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); }));
    $('emptyToggle').addEventListener('click',() => { const empty = $('emptyToggle').getAttribute('aria-pressed') !== 'true'; $('emptyToggle').setAttribute('aria-pressed',String(empty)); renderChat(empty); });
    $('chatTab').addEventListener('click',scrollLatest);
    renderChat(); syncInput();
  </script>
</body>
</html>
