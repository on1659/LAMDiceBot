<!doctype html>
<html lang="ko" data-theme="dark" data-skin="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>LAMDice · 모바일 경마 결과 목업</title>
  <script src="/js/shared/theme-shared.js"></script>
  <script src="/mockups/horse-mobile-theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <style>
    /* 고정 예시 결과로 보여주는 독립 목업. 실제 게임에는 연결하지 않는다. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--mobile-canvas); color: var(--mobile-ink); font: 500 14px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; }
    button,textarea { font: inherit; color: inherit; }
    button,a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid var(--mock-emphasis); outline-offset: 3px; }
    h1,h2,p { margin: 0; }
    img { display: block; object-fit: contain; image-rendering: pixelated; }
    .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #mockBar { min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 10px; background: var(--mobile-card); color: var(--mobile-muted); border-bottom: 1px solid var(--mobile-line); font-size: 11px; }
    #mockBar button { min-height: 28px; padding: 3px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--mobile-ink); font-size: 11px; }
    #mockBar button[aria-pressed="true"] { background: var(--mobile-soft); }
    .prototype { max-width: 430px; height: calc(100dvh - 37px); margin: auto; display: flex; flex-direction: column; background: var(--mobile-canvas); }
    .room-head { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; border-bottom: 1px solid var(--mobile-line); flex: none; }
    .icon-button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 1px solid var(--mobile-line); border-radius: 12px; background: var(--mobile-card); color: var(--mobile-ink); text-decoration: none; flex: none; }
    .identity { flex: 1; min-width: 0; }
    .identity small { color: var(--mobile-muted); font-size: 11px; }
    .identity h1 { font-size: 17px; font-weight: 750; letter-spacing: -.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .people-button { width: auto; padding: 0 11px; font-size: 13px; font-weight: 700; }
    button,input,select { font: inherit; color: inherit; }
    h3 { margin: 0; }
    .content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 16px; overflow: auto; overscroll-behavior: contain; }
    .page-head { display: flex; align-items: center; justify-content: space-between; min-height: 36px; flex: none; }
    .page-head h2 { font-size: 24px; letter-spacing: -.8px; }
    .round { color: var(--mobile-muted); font-size: 11px; }
    .winner-card { display: flex; align-items: center; gap: 16px; min-height: 108px; padding: 14px; border: 1px solid var(--mock-emphasis); border-radius: 16px; background: var(--mobile-card); flex: none; }
    .winner-visual { position: relative; flex: none; width: 76px; height: 76px; display: grid; place-items: center; border-radius: 16px; background: var(--mobile-soft); }
    .winner-visual > img { width: 72px; height: 62px; }
    .winner-visual .medal { position: absolute; right: -3px; top: -5px; width: 23px; height: 23px; }
    .winner-copy { min-width: 0; flex: 1; }
    .winner-label { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 7px; border-radius: 6px; background: var(--mobile-soft); color: var(--mock-emphasis); font-size: 11px; font-weight: 700; }
    .winner-copy h3 { font-size: 28px; line-height: 1.25; letter-spacing: -.7px; margin: 5px 0 3px; overflow-wrap: anywhere; }
    .winner-copy > p { font-size: 12px; color: var(--mobile-muted); }
    .winner-card.empty h3 { font-size: 20px; }
    .orders-link { display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 9px 12px; border-radius: 12px; background: var(--mobile-soft); color: var(--mobile-ink); text-decoration: none; flex: none; }
    .orders-link .icon { width: 18px; height: 18px; color: var(--mock-emphasis); }
    .orders-link strong { font-size: 13px; font-weight: 650; }
    .orders-link small { margin-left: auto; font-size: 11px; color: var(--mobile-muted); }
    .orders-link .chevron { width: 14px; height: 14px; color: var(--mobile-muted); }
    .finish-section { flex: none; }
    .finish-head { min-height: 30px; display: flex; align-items: center; justify-content: space-between; }
    .finish-head h3 { font-size: 13px; font-weight: 700; }
    .finish-head small { font-size: 10px; color: var(--mobile-muted); }
    .finish-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--mobile-line); border-radius: 16px; background: var(--mobile-card); overflow: hidden; }
    .finish-row { min-height: 40px; display: flex; align-items: center; gap: 9px; padding: 4px 12px; border-bottom: 1px solid var(--mobile-line); }
    .finish-row:last-child { border-bottom: 0; }
    .finish-row.target { background: var(--mobile-soft); }
    .rank-number { min-width: 20px; min-height: 24px; display: grid; place-items: center; flex: none; color: var(--mobile-muted); font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .target .rank-number { border-radius: 7px; background: var(--mobile-accent); color: var(--mobile-on-accent); }
    .finish-row > img { width: 32px; height: 29px; }
    .rank-copy { min-width: 0; flex: 1; }
    .rank-name { display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 1.3; font-weight: 650; }
    .rank-users { display: block; margin-top: 1px; font-size: 10px; line-height: 1.3; color: var(--mobile-muted); overflow-wrap: anywhere; }
    .target-tag { color: var(--mock-emphasis); font-size: 9px; font-weight: 700; }
    .finish-time { flex: none; font-size: 11px; color: var(--mobile-muted); font-variant-numeric: tabular-nums; }
    .ad { flex: none; min-height: 54px; margin-top: auto; display: grid; place-items: center; border: 1px dashed var(--mobile-line); border-radius: 10px; color: var(--mobile-muted); font-size: 10px; letter-spacing: 1px; }
    .footer { flex: none; padding: 8px 12px max(8px,env(safe-area-inset-bottom)); border-top: 1px solid var(--mobile-line); background: var(--mobile-canvas); }
    .dock { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .dock button,.dock a { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: transparent; color: var(--mobile-muted); font-size: 10px; text-decoration: none; }
    .dock img,.dock .icon { width: 19px; height: 19px; }
    .dock button[aria-current="page"] { background: var(--mobile-soft); color: var(--mobile-ink); font-weight: 750; }
    dialog { width: min(398px,calc(100% - 24px)); max-height: calc(100dvh - 36px); margin: auto auto 12px; padding: 20px; border: 1px solid var(--mobile-line); border-radius: 20px; background: var(--mobile-card); color: var(--mobile-ink); overflow: auto; }
    dialog::backdrop { background: rgba(var(--shadow-rgb),.65); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .dialog-head h2 { font-size: 20px; letter-spacing: -.6px; }
    .dialog-head .icon-button { border: 0; background: var(--mobile-soft); }
    .footer { padding: 12px 16px max(8px,env(safe-area-inset-bottom)); }
    .actions { display: flex; gap: 8px; }
    .prepare { min-height: 48px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; border: 0; border-radius: 14px; background: var(--mobile-accent); color: var(--mobile-on-accent); text-decoration: none; font-size: 15px; font-weight: 750; }
    .prepare .icon { width: 18px; height: 18px; }
    .replay { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--mobile-line); border-radius: 14px; background: var(--mobile-card); color: var(--mobile-ink); text-decoration: none; }
    .dock { margin: 9px -4px 0; }
    .person-row { display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid var(--mobile-line); }
    .person-row:last-child { border-bottom: 0; }
    .person-row img { width: 35px; height: 32px; }
    .person-row span { flex: 1; }
    .person-row small { color: var(--mobile-muted); font-size: 11px; }
    @media(min-width:600px) { .prototype { border-inline: 1px solid var(--mobile-line); } }
    @media(max-width:350px) { .room-head { gap: 8px; padding-inline: 12px; } .identity h1 { font-size: 15px; } .content { padding-inline: 12px; gap: 10px; } .winner-card { gap: 12px; padding: 12px; } .winner-visual { width: 66px; height: 66px; } .winner-visual > img { width: 62px; height: 54px; } .footer { padding-inline: 12px; } .finish-row { gap: 7px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation: none !important; transition: none !important; } button:active:not(:disabled) { transform: none; } }
  </style>
  <link rel="stylesheet" href="/mockups/horse-mobile-theme.css?v=polish-2">
</head>
<body data-mock-view="result">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 11h.01M11 11h.01M15 11h.01"/></symbol>
    <symbol id="i-cup" viewBox="0 0 24 24"><path d="M5 8h12v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4ZM17 9h2a3 3 0 0 1 0 6h-2M8 3v2m4-3v3m4-2v2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/></symbol>
  </defs></svg>
  <div id="mockBar"><span>목업 · 경마 결과</span><button id="themeToggle">테마</button><button data-mock-page="racing">진행 보기</button></div>
  <div class="prototype">
    <header class="room-head"><a class="icon-button" href="/mockups/horse-ready-mobile.html" data-mock-page="ready" aria-label="준비 화면으로"><svg class="icon"><use href="#i-back"/></svg></a><div class="identity"><small>경마 · 경주 종료</small><h1>점심 먹고 한 판</h1></div><button class="icon-button people-button" id="peopleButton" aria-label="참여자 4명 보기"><svg class="icon"><use href="#i-people"/></svg>4</button></header>
    <main class="content">
      <div class="page-head"><h2>경주 결과</h2><span class="round">1라운드</span></div>
      <section class="winner-card" id="winnerCard" aria-labelledby="winnerName"><div class="winner-visual"><img id="winnerImage" alt=""><img class="medal" src="/mockups/assets/ic-trophy.png" alt=""></div><div class="winner-copy"><span class="winner-label" id="winnerLabel"></span><h3 id="winnerName"></h3><p id="winnerDetail"></p></div></section>
      <a class="orders-link" href="/mockups/horse-orders-mobile.html" data-mock-page="orders"><svg class="icon" aria-hidden="true"><use href="#i-cup"/></svg><strong>주문 정리표</strong><small id="ordersTotal"></small><svg class="icon chevron" aria-hidden="true"><use href="#i-next"/></svg></a>
      <section class="finish-section" aria-labelledby="finishTitle"><div class="finish-head"><h3 id="finishTitle">도착 순위</h3><small>예시 기록</small></div><ol class="finish-list" id="finishList"></ol></section>
      <aside class="ad" aria-label="광고 자리">AD</aside>
    </main>
    <footer class="footer"><div class="actions"><a class="prepare" href="/mockups/horse-ready-mobile.html" data-mock-page="ready"><svg class="icon" aria-hidden="true"><use href="#i-flag"/></svg>다시 준비</a><a class="replay" href="/mockups/horse-racing-mobile.html" data-mock-page="racing" aria-label="경주 다시 보기"><svg class="icon"><use href="#i-replay"/></svg></a></div><nav class="dock" aria-label="방 메뉴"><button id="gameTab" aria-current="page"><img src="/mockups/assets/ic-play.png" alt="">게임</button><a href="/mockups/horse-orders-mobile.html" data-mock-page="orders"><svg class="icon" aria-hidden="true"><use href="#i-cup"/></svg>주문</a><a href="/mockups/horse-chat-mobile.html" data-mock-page="chat"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg>채팅</a><a href="/mockups/horse-menu-mobile.html" data-mock-page="menu"><img src="/mockups/assets/ic-gamepad.png" alt="">메뉴</a></nav></footer>
  </div>
  <dialog id="peopleDialog" aria-labelledby="peopleTitle"><div class="dialog-head"><h2 id="peopleTitle">참여자 4</h2><button class="icon-button" id="closePeople" aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="peopleList"></div></dialog>
  <script src="/mockups/horse-race-demo.js"></script>
  <script>
    'use strict';
    const DATA = window.HorseRaceMockData;
    const $ = id => document.getElementById(id);
    function node(tag,cls,text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text !== undefined) el.textContent = text; return el; }
    function sprite(vehicle) { const image = node('img'); image.src = '/assets/horse-race/vehicles/' + vehicle + '/base-idle-1.webp'; image.alt = ''; return image; }
    const target = DATA.racers.find(r => r.rank === DATA.targetRank);
    $('winnerLabel').textContent = DATA.targetRank + '등 당첨';
    $('winnerImage').src = sprite(target.id).src;
    $('winnerName').textContent = DATA.winners.length ? DATA.winners.map(p => p.name).join(', ') : '당첨자 없음';
    $('winnerDetail').textContent = DATA.winners.length ? target.label + ' · ' + target.time.toFixed(2) + '초' : '선택한 사람이 없어요';
    $('winnerCard').classList.toggle('empty',!DATA.winners.length);
    $('ordersTotal').textContent = '총 ' + DATA.people.filter(p => p.order).length + '잔';
    DATA.racers.forEach(racer => { const row = node('li',racer.rank === DATA.targetRank ? 'finish-row target' : 'finish-row'), rank = node('span','rank-number',String(racer.rank)), copy = node('div','rank-copy'), title = node('p','rank-name',racer.label); if (racer.rank === DATA.targetRank) title.append(node('span','target-tag','당첨')); copy.append(title,node('small','rank-users',racer.users.length ? racer.users.join(', ') : '선택 없음')); row.append(rank,sprite(racer.id),copy,node('span','finish-time',racer.time.toFixed(2) + '초')); $('finishList').append(row); });
    $('peopleButton').addEventListener('click',() => { $('peopleList').replaceChildren(); DATA.people.forEach(p => { const row = node('div','person-row'), racer = DATA.racers.find(r => r.id === p.vehicle); row.append(sprite(p.vehicle),node('span','',p.name),node('small','',p.role === '관전자' ? '관전자' : racer.rank + '등')); $('peopleList').append(row); }); $('peopleDialog').showModal(); });
    $('closePeople').addEventListener('click',() => $('peopleDialog').close());
    $('peopleDialog').addEventListener('click',e => { const d = $('peopleDialog'); if (e.target !== d) return; const r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); });
    $('gameTab').addEventListener('click',() => document.querySelector('.content').scrollTop = 0);
  </script>
</body>
</html>
