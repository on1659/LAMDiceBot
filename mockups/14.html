<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LAMDice 14 — 모임 탭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* 독립 목업: 공용 파일을 수정하지 않으므로 색 토큰도 이 파일에 격리한다. */
:root{color-scheme:light;--ground:#f2f1ed;--surface:#fdfcf9;--raised:#fff;--ink:#202936;--muted:#68707a;--line:#d9dcd9;--accent:#203a56;--on-accent:#fff;--soft:#e6eaf0;--focus:#436daf;--error:#ac342d;--backdrop:#11182099;--grass:#d6dec1;--track:#ecddbc;--track-line:#faf3df;--sky:#e8ece5;--shadow:#1e2c4012;--body: 'Pretendard','Apple SD Gothic Neo',sans-serif;--display:'Black Han Sans',var(--body)}
[data-theme="dark"]{color-scheme:dark;--ground:#141413;--surface:#222221;--raised:#2c2c2a;--ink:#faf9f5;--muted:#bdbbb3;--line:#494943;--accent:#405a78;--soft:#333a41;--focus:#a3b8dc;--error:#f2a89f;--shadow:#00000020}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--ground);color:var(--ink);font:500 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--raised);border-radius:12px;min-height:44px;padding:10px 14px}button:disabled{cursor:default;opacity:.58}button:hover:not(:disabled){border-color:var(--muted)}button:active:not(:disabled){transform:translateY(1px)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}img{display:block;max-width:100%;image-rendering:pixelated}h1,h2,p{margin:0}h1{font:400 clamp(38px,5vw,56px)/1.2 var(--display);letter-spacing:-1.5px}h2{font-size:24px;letter-spacing:-.7px}a{color:inherit}small,.muted{color:var(--muted)}
#mockBar{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:3px 6px;background:var(--ink);color:var(--surface);font-size:11px;white-space:nowrap}#mockBar button{font-size:11px;min-height:24px;padding:1px 7px;border-radius:4px;background:transparent;color:inherit;border-color:var(--muted)}#mockBar button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.app{max-width:1080px;margin:auto;padding:0 24px}.header{height:88px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900;letter-spacing:-.8px}.brand img{width:30px}.account{font-size:14px;background:transparent;border-color:transparent;display:flex;align-items:center;gap:7px}.account img{width:24px}.home{min-height:610px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:48px;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;box-shadow:0 16px 48px var(--shadow)}.intro{grid-column:2;grid-row:1;align-self:start;padding-top:8px}.scope{display:flex;gap:7px;align-items:center;border:0;background:none;padding:0;min-height:44px;font-size:14px;text-align:left}.scope strong{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scope-note{font-size:12px;color:var(--muted);margin:0 0 28px}.art{position:relative;grid-column:1;grid-row:1/3;aspect-ratio:1/1.13;border-radius:160px 160px 24px 24px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}.sun{position:absolute;top:15%;right:20%;width:50px;height:50px;background:var(--track-line);box-shadow:8px 0 var(--track-line),0 8px var(--track-line),-8px 0 var(--track-line),0 -8px var(--track-line)}.grass{position:absolute;inset:43% 0 0;background:var(--grass)}.lane{position:absolute;inset:53% -30% 13%;border:30px solid var(--track);border-radius:50%;transform:rotate(-18deg);outline:3px solid var(--track-line)}.rail{position:absolute;left:12%;right:12%;bottom:17%;height:6px;border-top:3px solid var(--track-line);border-bottom:3px solid var(--track-line);transform:rotate(-18deg)}.horse{position:absolute;left:14%;top:40%;width:74%;height:42%;background:url(/mockups/assets/veh-horse-1.webp) center/contain no-repeat;image-rendering:pixelated;animation:gallop .34s steps(1) infinite}.horse-shadow{position:absolute;left:30%;top:74%;width:40%;height:8px;background:var(--shadow);border-radius:50%}.actions{grid-column:2;grid-row:2;align-self:end;display:grid;gap:12px}.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800;min-height:60px;font-size:18px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px}.primary img{width:25px}.secondary{width:100%;font-weight:700;border-color:transparent;background:transparent}.rooms{display:flex;align-items:center;justify-content:space-between;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;margin-top:14px;padding-inline:0;font-size:14px}#roomCount{margin-left:4px}.rooms img{width:21px;margin-right:7px}.rooms span:first-child{display:flex;align-items:center}.arrow{font-size:22px;font-weight:400}.room{max-width:620px;margin:12px auto 48px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px}.room-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.room-stage{background:var(--sky);height:180px;border-radius:18px;display:grid;place-items:center;margin:20px 0}.room-stage img{width:160px}.participants{padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:20px;display:flex;justify-content:space-between;gap:12px}.room .secondary{margin-top:8px}.room small{display:block}.tag{font-size:12px;color:var(--muted)}.room h1{font-size:32px}.room-info{margin-bottom:16px;font-size:14px;color:var(--muted)}
dialog{padding:24px;border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--ink);width:min(440px,calc(100% - 24px));max-height:calc(100dvh - 48px);overflow-y:auto}dialog::backdrop{background:var(--backdrop)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.close{border:0;background:transparent;font-size:24px;padding:0;width:44px;flex:none}.panel{display:grid;gap:14px}.panel p{font-size:14px;color:var(--muted)}.panel label{font-size:14px;font-weight:700;display:grid;gap:7px}input{width:100%;height:52px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:0 13px;background:var(--raised)}.list{display:grid;gap:8px}.list button{display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;padding:12px}.list img{width:40px;flex:none}.list .label{flex:1;overflow-wrap:anywhere}.list small{display:block;font-size:12px;font-weight:500}.list b{font-size:15px}.list button[aria-pressed=true]{border-color:var(--focus);background:var(--soft)}.message{min-height:20px;font-size:13px;color:var(--error)}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs button[aria-pressed=true]{background:var(--soft);border-color:var(--focus)}.copyfield{font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes gallop{50%{background-image:url(/mockups/assets/veh-horse-2.webp)}}
@media(max-width:720px){.app{padding:0 22px}.header{height:72px}.brand{font-size:19px}.home{min-height:0;border:0;border-radius:0;box-shadow:none;background:transparent;padding:6px 0 26px;display:flex;flex-direction:column;gap:0;align-items:stretch}.intro{padding:0}.scope-note{margin:0 0 20px}.scope{min-height:44px}.intro h1{font-size:40px;line-height:1.17}.art{height:260px;aspect-ratio:auto;width:100%;border-radius:130px 130px 20px 20px;margin:23px 0 24px}.horse{left:20%;width:62%;top:34%;height:55%}.actions{gap:5px;align-self:stretch;width:100%}.primary{min-height:60px}.rooms{margin-top:12px;min-height:50px}.room{padding:20px;margin-top:0}.room-head{gap:8px}.room h1{font-size:28px}dialog{margin:auto auto 12px;padding:20px;border-radius:22px}.room-stage{height:160px}}
@media(max-width:380px){#mockBar{gap:5px}.header .account{padding-inline:8px}.app{padding-inline:20px}}
@media(prefers-reduced-motion:reduce){.horse{animation:none}}

.entry,.lobby{max-width:560px;margin:34px auto 64px}.entry h1{font-size:40px;margin-bottom:42px}.my-servers h2,.lobby-rooms h2{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:12px;letter-spacing:0}.entry-list{display:grid;gap:12px}.entry-card{display:flex;align-items:center;gap:18px;width:100%;min-height:112px;padding:22px 24px;background:var(--surface);text-align:left;border-radius:20px}.entry-card img{width:56px;height:56px;flex:none}.entry-card>span:not(.arrow){flex:1;min-width:0}.entry-card strong{display:block;font-size:20px;overflow-wrap:anywhere}.entry-card small{display:block;font-size:13px;margin-top:4px}.entry-card .arrow{color:var(--muted)}.my-servers .entry-card{border-color:var(--accent);border-width:2px}.free-card{margin-top:16px}.entry-tools{display:flex;gap:12px;border-top:1px solid var(--line);margin-top:32px;padding-top:16px}.entry-tools button{flex:1;background:transparent;border-color:transparent;font-size:14px}.lobby h1{font-size:36px;margin:18px 0 8px;overflow-wrap:anywhere}.lobby .scope-note{margin-bottom:24px}.rooms-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.rooms-heading h2{margin-bottom:0}.create-game{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:9px 14px;border-radius:10px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;white-space:nowrap}.lobby-rooms{margin-top:36px}.lobby-rooms .list button{min-height:88px;background:var(--surface);border-radius:16px}.lobby-rooms h2 span{margin-left:6px}.lobby-rooms .list .room-occupancy{font-size:13px;color:var(--muted)}
@media(max-width:720px){.entry,.lobby{margin:26px auto 40px}.entry h1{font-size:34px;margin-bottom:32px}.entry-card{padding:20px;min-height:110px}.entry-card img{width:48px;height:48px}.lobby h1{font-size:32px}}
/* 같은 기능, 다른 탐색 배치를 비교하는 독립 목업 */
.header-tools,.context-tools,.utility-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.header-tools button,.context-tools button{min-height:44px;padding:8px 12px;font-size:14px;background:transparent}.header-tools img,.context-tools img,.utility-nav img{width:20px;height:20px}.feature-trigger{display:inline-flex;gap:7px;align-items:center;justify-content:center}.entry-news{display:block;margin:12px auto 0;border:0;background:transparent;font-size:13px;color:var(--muted)}.context-tools{margin-top:12px}.context-tools button{border-color:var(--line);background:var(--surface)}.feature-menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}.feature-menu button{min-height:68px;display:flex;gap:9px;align-items:center;justify-content:flex-start;text-align:left}.feature-menu img{width:27px;height:27px}.feature-section{display:grid;gap:12px}.feature-section h3{margin:12px 0 0;font-size:16px}.feature-section .lead{font-size:14px;color:var(--muted)}.feature-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.feature-row img{width:28px;height:28px}.feature-row strong{overflow-wrap:anywhere}.feature-row .grow{flex:1;min-width:0}.feature-row small{display:block}.feature-row button{font-size:13px;padding:6px 10px}.feature-tabs{display:flex;gap:6px;flex-wrap:wrap}.feature-tabs button{min-height:40px;padding:7px 12px;font-size:13px}.feature-tabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.feature-section label{display:grid;gap:6px;font-size:14px}.feature-section select,.feature-section textarea{font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}.feature-section input[type=checkbox]{width:20px;height:20px}.feature-section input[type=range]{padding:0;accent-color:var(--accent)}.feature-section .inline-label{display:flex;gap:10px;align-items:center}.feature-section form{display:grid;gap:10px}.feature-section .small-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-height:44px;font-weight:700}.feature-section .muted{font-size:13px}.feature-status{font-size:13px;color:var(--focus);min-height:20px}.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.mini-grid button{padding:2px;min-height:36px;font-size:12px;border-radius:7px}.mini-grid .selected{border-color:var(--accent);background:var(--soft)}.mini-bar{height:5px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:7px}.mini-bar span{display:block;height:100%;background:var(--accent)}.rank-person{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left}.rank-person .grow{flex:1}.rank-person small{display:block}.room-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.room-tools button{min-height:58px;padding:8px 4px;font-size:13px}.room-tools img{width:22px;margin:0 auto 4px}.protected-note{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px}.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.skin-grid button{height:56px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat-card{padding:18px;background:var(--soft);border-radius:12px}.stat-card strong{display:block;font-size:24px}.feature-section a{font-size:14px}.feature-room-name{font-size:12px;color:var(--muted)}.room .primary{min-height:44px;font-size:15px}.room .room-stage{height:96px}.room .room-stage img{width:76px}.room-tools .feature-trigger{display:block}.room h1{overflow-wrap:anywhere}
[data-skin=black]{--ground:#080808;--surface:#181818;--raised:#222;--line:#444}[data-skin=midnight]{--ground:#0e1420;--surface:#1a2332;--raised:#243044;--line:#465266}[data-skin=mocha]{--ground:#191411;--surface:#2b2420;--raised:#39302a;--line:#5a4e43}[data-skin=purple]{--ground:#18131d;--surface:#292131;--raised:#362b41;--line:#584963}
@media(max-width:720px){.header-tools{gap:3px}.header-tools button{padding:8px}.feature-menu{gap:7px}.room-tools{grid-template-columns:repeat(3,minmax(0,1fr))}#mockBar{gap:4px;font-size:10px}#mockBar button{padding:1px 5px;font-size:10px}.context-tools{gap:6px}.context-tools button{padding:7px 10px}}


/* 14: 서버별 기능을 하나의 짧은 탭 묶음으로 읽는 모임 화면. */
.scope-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
.scope-heading h1{min-width:0;flex:1}
.scope-heading #manageScope{background:transparent;border-color:transparent;font-size:13px;padding:8px 12px;flex:none}
.lobby .scope-note{margin-bottom:24px}
.group-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
.group-tabs button{min-width:0;min-height:46px;padding:9px 8px;border-radius:9px;border:1px solid transparent;background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.group-tabs button[aria-current=page]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 2px 5px var(--shadow)}
.group-tabs .feature-trigger{gap:6px}
.group-tabs img{width:18px;height:18px}
.room-list-tools{display:flex;align-items:center;gap:10px;min-width:0}
.room-list-tools h2{white-space:nowrap}
.room-search{font-size:12px;padding:8px;border-color:transparent;background:transparent;color:var(--muted);min-height:44px}
.lobby-rooms{margin-top:28px}
@media(min-width:721px){.lobby{max-width:640px}.group-tabs{max-width:440px}.lobby-rooms .list{gap:10px}.lobby-rooms .list button{padding-inline:20px;min-height:92px}.scope-heading h1{font-size:40px}}
@media(max-width:720px){.lobby{margin-top:14px}.scope-heading h1{margin-top:14px}.lobby .scope-note{margin-bottom:22px}.group-tabs{gap:2px;padding:4px}.group-tabs button{padding:8px 5px;min-height:44px}.rooms-heading{gap:8px}.room-list-tools{gap:3px}.create-game{padding:9px 12px;font-size:13px}.lobby-rooms{margin-top:22px}}

</style>
</head>
<body>
<div id="mockBar"><span>14</span><a href="/main">목록</a><a href="/13">이전</a><button data-state="new" aria-pressed="true">처음</button><button data-state="return" aria-pressed="false">단골</button><button data-state="member" aria-pressed="false">로그인</button><button id="ownerState" aria-pressed="false">관리자</button><button id="darkToggle" aria-pressed="false">다크</button></div>
<div class="app">
<header class="header"><div class="brand"><img src="/mockups/assets/ic-dice.png" alt="">LAMDice</div><div class="header-tools"><button class="feature-trigger" data-feature="menu" aria-label="메뉴"><img src="/mockups/assets/ic-gamepad.png" alt="">메뉴</button></div></header>
<main id="entry" class="entry">
  <h1 id="entryTitle" tabindex="-1">어디서 놀까요?</h1>
  <section class="my-servers" aria-labelledby="myServersTitle"><h2 id="myServersTitle">내 서버</h2><div id="myServers" class="entry-list"></div></section>
  <button id="freeEntry" class="entry-card free-card"><img src="/mockups/assets/ic-door.png" alt=""><span><strong>자유 방</strong><small>로그인 없이 · 팀 기록 없음</small></span><span class="arrow" aria-hidden="true">›</span></button>
  <div class="entry-tools"><button id="findServers">서버 찾기</button><button id="createServerEntry">새 서버 만들기</button></div><button class="entry-news" data-feature="updates">업데이트</button>
</main>
<main id="home" class="lobby" hidden>
  <button id="scope" class="scope"><span aria-hidden="true">‹</span> 서버 선택</button>
  <div class="scope-heading"><h1 id="scopeText" tabindex="-1">자유 방</h1><button data-feature="manage" id="manageScope" hidden>관리</button></div>
  <p id="scopeNote" class="scope-note">서버 기록 없음</p>
  <nav class="group-tabs" aria-label="모임 기능">
    <button id="lobbyTab" aria-current="page">방</button>
    <button class="feature-trigger" data-feature="ranking"><img src="/mockups/assets/ic-trophy.png" alt="">랭킹</button>
    <button data-feature="history">기록</button>
    <button data-feature="members">멤버</button>
  </nav>
  <section class="lobby-rooms" aria-labelledby="roomsTitle"><div class="rooms-heading"><div class="room-list-tools"><h2 id="roomsTitle">열린 방 <span id="roomCount">2</span></h2><button data-feature="lobbytools" class="room-search">찾기</button></div><button id="createRoom" class="create-game"><span aria-hidden="true">+</span> 게임 만들기</button></div><div id="lobbyRoomList" class="list"></div></section>
</main>
<main id="room" class="room" hidden><div class="room-head"><span class="tag">예시 방 · 실제 연결 없음</span><button id="leaveRoom">나가기</button></div><p class="tag" id="roomScope"></p><h1 id="roomTitle" tabindex="-1"></h1><div class="room-stage"><img id="roomArt" src="/mockups/assets/ic-horse.png" alt=""></div><div class="participants"><strong id="roomPerson"></strong><span id="roomPeople"></span></div><p class="room-info">친구에게 링크를 보내 함께 들어와요.</p><button id="invite" class="primary">예시 초대 링크 보기</button><div class="room-tools"><button data-feature="chat">채팅</button><button data-feature="orders">주문</button><button data-feature="participants">참여자</button><button data-feature="roomsettings">방 설정</button><button data-feature="gametools">게임 설정</button><button data-feature="roomhistory">게임 기록</button></div><div class="tabs"><button id="roomGame">게임 바꾸기</button><button id="readyRoom">준비</button><button id="startRoom">시작</button></div><small>이 목업에서는 게임을 시작하지 않아요.</small></main>
</div>
<button id="account" hidden></button><span id="accountText" hidden></span>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close" id="closeDialog" aria-label="닫기">×</button></div>
<div class="panel feature-section" id="extras" hidden></div>
<form class="panel" id="identity" hidden><p>결과에 표시할 이름을 확인해 주세요.</p><label>이름<input id="name" name="name" maxlength="12" autocomplete="nickname" required></label><p class="message" id="nameError" role="status"></p><button class="primary" type="submit">이 이름으로 입장</button></form>
<div class="panel" id="games" hidden><div class="list" id="gameList"></div></div>
<div class="panel" id="servers" hidden><label>서버 검색<input id="serverSearch" type="search" placeholder="서버 이름"></label><p>서버 안의 게임은 기록과 랭킹이 남아요.</p><div class="list" id="serverList"></div><button id="newServer">새 서버 만들기</button><p id="serverMessage" role="status"></p></div>
<form class="panel" id="code" hidden><p>예시 참여코드: 2468</p><label>참여코드<input id="serverCode" inputmode="numeric" maxlength="6" required autocomplete="off"></label><p class="message" id="codeError" role="status"></p><button class="primary" type="submit">서버 들어가기</button></form>
<form class="panel" id="serverCreate" hidden><label>서버 이름<input id="serverName" minlength="2" maxlength="20" required autocomplete="off"></label><label>설명 (선택)<input id="serverDescription" maxlength="100" autocomplete="off"></label><label>참여코드 (선택)<input id="newCode" pattern="[A-Za-z0-9]{4,20}" maxlength="20" placeholder="영문·숫자 4~20자리" autocomplete="off"></label><p>이 기기에서만 표시되는 예시 서버예요.</p><p class="message" id="serverError" role="status"></p><button class="primary" type="submit">만들고 선택</button></form>
<div class="panel" id="roomsPanel" hidden><p id="roomsScope"></p><div class="list" id="roomList"></div></div>
<form class="panel" id="auth" hidden><div class="tabs"><button type="button" id="loginTab" aria-pressed="true">로그인</button><button type="button" id="signupTab" aria-pressed="false">회원가입</button></div><p id="authNote">예시 계정: 라온 / 1234</p><label>이름<input id="authName" maxlength="12" required autocomplete="username"></label><label>암호코드<input id="authCode" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required autocomplete="current-password"></label><label id="pinConfirmLabel" hidden>암호코드 확인<input id="pinConfirm" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="new-password"></label><p id="authError" class="message" role="status"></p><button id="authSubmit" class="primary" type="submit">로그인</button></form>
<div class="panel" id="profile" hidden><p id="profileName"></p><button id="editName">이름 바꾸기</button><button id="logout">로그아웃</button></div>
<div class="panel" id="share" hidden><p>화면 확인용 예시 링크예요. 친구와 실제로 연결되지 않아요.</p><label>예시 링크<input id="shareLink" class="copyfield" readonly></label><button id="copy" class="primary">링크 복사</button><button id="nativeShare">공유하기</button><p id="copyStatus" role="status"></p></div>
</dialog>
<script>
'use strict';
const STORE_KEY='lamdice.mock14.identity';
const EXAMPLE_NAME='라온';
const EXAMPLE_PIN='1234';
const EXAMPLE_JOIN_CODE='2468';
const EXAMPLE_LINK='https://example.invalid/lamdice/room-14';
const GAMES=[{id:'horse',name:'경마',icon:'horse'},{id:'dice',name:'주사위',icon:'dice'},{id:'roulette',name:'룰렛',icon:'slot'},{id:'deguri',name:'데구리',note:'베타',icon:'paw'},{id:'ladder',name:'사다리',note:'준비 중',icon:'ladder',disabled:true}];
const SERVERS=[{id:'lunch',name:'점심친구',status:'joined'},{id:'club',name:'퇴근모임',status:'available'},{id:'team',name:'우리팀',status:'code'},{id:'weekend',name:'주말친구',status:'pending'}];
const ROOM_EXAMPLES=[{name:'점심 한 판',game:'horse',people:'민지 · 준호',occupied:2,capacity:8},{name:'커피는 누가',game:'dice',people:'유진',occupied:1,capacity:8}];
const $=id=>document.getElementById(id);
let name='',member=false,scope=null,game=GAMES[0],activeRoom=null,pendingRoom=null,editingName=false,authMode='login',afterAuth=null,opener=null;
try{name=localStorage.getItem(STORE_KEY)||'';}catch{}
function storeName(){try{localStorage.setItem(STORE_KEY,name);}catch{}}
function button(label,action){const el=document.createElement('button');el.type='button';el.textContent=label;el.addEventListener('click',action);return el;}
function close(){ $('dialog').close(); }
function show(panel,title){const fresh=!$('dialog').open;if(fresh)opener=document.activeElement;document.querySelectorAll('#dialog > .panel').forEach(el=>el.hidden=el.id!==panel);$('dialogTitle').textContent=title;if(fresh)$('dialog').showModal();const target=$(panel).querySelector('input,button');(target||$('closeDialog')).focus();}
$('closeDialog').onclick=close;
$('dialog').addEventListener('close',()=>{if(opener?.isConnected&&!opener.closest('[hidden]'))opener.focus();});
function renderHome(){ $('scopeText').textContent=scope?scope.name:'자유 방';$('scopeNote').textContent=scope?'기록 남음':'팀 기록 없음';$('accountText').textContent=member?name:'계정';renderEntry();syncExtras();document.querySelectorAll('[data-state]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.state===(member?'member':name?'return':'new'))));}
function entry(){activeRoom=null;$('room').hidden=true;$('home').hidden=true;$('entry').hidden=false;renderHome();}
function home(){activeRoom=null;$('entry').hidden=true;$('room').hidden=true;$('home').hidden=false;renderHome();renderRoomList('lobbyRoomList');}
function renderEntry(){const list=$('myServers');list.replaceChildren();if(!member){const login=entryCard('로그인하고 선택','','people',()=>{afterAuth=null;showAuth();});login.id='myServerLogin';list.append(login);return;}const joined=SERVERS.filter(s=>s.status==='joined');if(!joined.length){list.append(entryCard('서버 찾아보기','','people',showServers));return;}joined.forEach(s=>list.append(entryCard(s.name,'기록 남음','people',()=>pickServer(s))));}
function entryCard(title,note,icon,action){const b=button('',action);b.className='entry-card';const img=document.createElement('img');img.src='/mockups/assets/ic-'+icon+'.png';img.alt='';const label=document.createElement('span');const strong=document.createElement('strong');strong.textContent=title;label.append(strong);if(note){const small=document.createElement('small');small.textContent=note;label.append(small);}const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');b.append(img,label,arrow);return b;}
$('freeEntry').onclick=()=>pickServer(null);
$('findServers').onclick=showServers;
$('createServerEntry').onclick=()=>{if(member)newServer();else{afterAuth=newServer;showAuth();}};
function enterRoom(candidate){activeRoom=candidate||{name:game.name+' 한 판',game:game.id,people:'',occupied:0,capacity:8,owned:true};game=GAMES.find(g=>g.id===activeRoom.game);$('entry').hidden=true;$('home').hidden=true;$('room').hidden=false;$('roomTitle').textContent=activeRoom.name;$('roomScope').textContent=(scope?scope.name+' · 기록 남음':'자유 방 · 기록 없음');$('roomPerson').textContent=[name,activeRoom.people].filter(Boolean).join(' · ');$('roomPeople').textContent=(activeRoom.occupied+1)+' / '+activeRoom.capacity;$('roomArt').src='/mockups/assets/ic-'+game.icon+'.png';$('roomGame').hidden=!activeRoom.owned;$('roomTitle').focus();syncRoomExtras();}
function requestRoom(candidate=null){pendingRoom=candidate;editingName=false;$('identity').querySelector('[type=submit]').textContent='이 이름으로 입장';if(name){enterRoom(candidate);}else{$('name').value=EXAMPLE_NAME;$('nameError').textContent='';show('identity','이름 확인');$('name').select();}}
$('createRoom').onclick=()=>chooseGame('create');
$('lobbyTab').onclick=()=>{home();$('roomsTitle').scrollIntoView({block:'nearest'});};
$('identity').onsubmit=e=>{e.preventDefault();const value=$('name').value.trim();if(!value){$('nameError').textContent='이름을 입력해 주세요.';return;}name=value;storeName();close();if(editingName){renderHome();if(activeRoom)enterRoom(activeRoom);}else enterRoom(pendingRoom);};
$('leaveRoom').onclick=()=>{home();$('createRoom').focus();};
function chooseGame(mode){const list=$('gameList');list.replaceChildren();GAMES.forEach(g=>{const b=button('',()=>{game=g;if(mode==='create'){requestRoom();if(name)close();return;}close();renderHome();if(activeRoom){activeRoom.game=g.id;activeRoom.name=g.name+' 한 판';enterRoom(activeRoom);}});const img=document.createElement('img');img.src='/mockups/assets/ic-'+g.icon+'.png';img.alt='';const label=document.createElement('span');label.className='label';const title=document.createElement('b');title.textContent=g.name;label.append(title);if(g.note){const note=document.createElement('small');note.textContent=g.note;label.append(note);}b.append(img,label);b.disabled=!!g.disabled;if(mode==='change')b.setAttribute('aria-pressed',String(g.id===game.id));list.append(b);});show('games','게임 고르기');}
$('roomGame').onclick=()=>chooseGame('change');
function pickServer(s){scope=s;close();home();$('scopeText').focus();if(pendingInvite&&s?.id===pendingInvite.serverId){const target=pendingInvite.room;pendingInvite=null;requestRoom(target);}}
function showServers(){$('serverSearch').value='';const list=$('serverList');list.replaceChildren();const free=button('자유 방 · 기록 없음',()=>pickServer(null));free.setAttribute('aria-pressed',String(!scope));list.append(free);SERVERS.forEach(s=>{const b=button('',()=>{if(!member){afterAuth=showServers;showAuth();return;}if(s.status==='joined')pickServer(s);else if(s.status==='available'){requestServerJoin(s);}else if(s.status==='code'){$('serverCode').value='';$('codeError').textContent='';show('code',s.name);}else{$('serverMessage').textContent=s.name+' 가입 승인 대기 중이에요.';}});const label=document.createElement('span');label.className='label';const title=document.createElement('b');title.textContent=s.name;const note=document.createElement('small');note.textContent={joined:'가입됨 · 선택',available:'참여 가능 · 가입 신청',code:'참여코드 필요',pending:'승인 대기'}[s.status]+(s.description?' · '+s.description:'')+(s.code?' · 참여코드 '+s.code:'');label.append(title,note);b.append(label);b.setAttribute('aria-pressed',String(scope===s));list.append(b);});$('serverMessage').textContent=member?'':'서버 참여는 로그인 후 이용해요.';show('servers','서버 고르기');}
$('scope').onclick=()=>{entry();$('entryTitle').focus();};
$('code').onsubmit=e=>{e.preventDefault();if($('serverCode').value!==EXAMPLE_JOIN_CODE){$('codeError').textContent='코드가 맞지 않아요. 예시 코드는 2468이에요.';return;}const s=SERVERS.find(s=>s.id==='team');s.status='joined';pickServer(s);};
function newServer(){ $('serverName').value='';$('serverDescription').value='';$('newCode').value='';$('serverError').textContent='';show('serverCreate','새 서버 만들기');}
$('newServer').onclick=()=>{if(member)newServer();else{afterAuth=newServer;showAuth();}};
$('serverCreate').onsubmit=e=>{e.preventDefault();const value=$('serverName').value.trim();if(value.length<2){$('serverError').textContent='서버 이름을 입력해 주세요.';return;}const s={id:'created-'+SERVERS.length,name:value,status:'joined',description:$('serverDescription').value.trim(),code:$('newCode').value};SERVERS.push(s);ownedServerIds.add(s.id);isOwner=true;pickServer(s);};
function renderRoomList(id){const list=$(id);list.replaceChildren();ROOM_EXAMPLES.forEach(r=>{const b=button('',()=>requestRoom({...r,owned:false}));const img=document.createElement('img');img.src='/mockups/assets/ic-'+GAMES.find(g=>g.id===r.game).icon+'.png';img.alt='';const label=document.createElement('span');label.className='label';const title=document.createElement('b');title.textContent=r.name;const note=document.createElement('small');note.textContent=GAMES.find(g=>g.id===r.game).name+' · 대기 중';label.append(title,note);const count=document.createElement('span');count.className='room-occupancy';count.textContent=r.occupied+' / '+r.capacity;b.append(img,label,count);list.append(b);});}

function setAuth(mode){authMode=mode;$('pinConfirmLabel').hidden=mode!=='signup';$('pinConfirm').required=mode==='signup';$('loginTab').setAttribute('aria-pressed',String(mode==='login'));$('signupTab').setAttribute('aria-pressed',String(mode==='signup'));$('authSubmit').textContent=mode==='login'?'로그인':'회원가입';$('authNote').textContent=mode==='login'?'예시 계정: 라온 / 1234':'목업 안에서만 가입돼요. 실제 암호는 입력하지 마세요.';$('authCode').autocomplete=mode==='login'?'current-password':'new-password';$('authError').textContent='';}
function showAuth(){setAuth('login');$('authName').value='';$('authCode').value='';show('auth','계정');}
$('loginTab').onclick=()=>setAuth('login');$('signupTab').onclick=()=>setAuth('signup');
$('account').onclick=()=>{afterAuth=null;if(member){$('profileName').textContent=name+'님 · 예시 계정';show('profile','내 계정');}else showAuth();};
$('auth').onsubmit=e=>{e.preventDefault();const value=$('authName').value.trim();if(!value){$('authError').textContent='이름을 입력해 주세요.';return;}if(authMode==='signup'&&$('authCode').value!==$('pinConfirm').value){$('authError').textContent='암호코드가 같지 않아요.';return;}if(authMode==='signup'&&value===EXAMPLE_NAME){$('authError').textContent='이미 있는 이름이에요. 로그인하거나 다른 이름을 골라 주세요.';return;}if(authMode==='login'&&(value!==EXAMPLE_NAME||$('authCode').value!==EXAMPLE_PIN)){$('authError').textContent='이 예시에서는 라온 / 1234로 로그인해 주세요.';return;}name=value;member=true;storeName();renderHome();if(afterAuth){const next=afterAuth;afterAuth=null;next();}else close();};
$('editName').onclick=()=>{editingName=true;$('identity').querySelector('[type=submit]').textContent='이름 저장';$('name').value=name;$('nameError').textContent='';show('identity','이름 바꾸기');};
$('logout').onclick=()=>{member=false;scope=null;close();entry();};
$('invite').onclick=()=>{$('shareLink').value=EXAMPLE_LINK;$('copyStatus').textContent='';show('share','예시 초대 링크');};
$('copy').onclick=async()=>{try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(EXAMPLE_LINK);$('copyStatus').textContent='예시 링크를 복사했어요.';}catch{$('shareLink').focus();$('shareLink').select();$('copyStatus').textContent='자동 복사가 안 돼요. 선택된 링크를 길게 누르거나 Ctrl/Cmd+C로 복사해 주세요.';}};
document.querySelectorAll('[data-state]').forEach(el=>el.onclick=()=>{isOwner=false;ownedServerIds.clear();pendingInvite=null;close();name=el.dataset.state==='new'?'':EXAMPLE_NAME;member=el.dataset.state==='member';scope=null;game=GAMES[0];storeName();entry();});
$('darkToggle').onclick=()=>{delete document.documentElement.dataset.skin;const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('darkToggle').setAttribute('aria-pressed',String(dark));};
/* FEATURE ENGINE START — 예시 상태만 바꾸며 운영 API를 호출하지 않는다. */
const LIMITS={minGames:5,maxRanks:10,maxChat:160,maxTitle:30,maxOrder:40};
const SITE='https://lamdice.com';
const GAME_URLS={horse:'/horse-race',dice:'/game',roulette:'/roulette',deguri:'/deguri'};
const LINKS=[['게임 가이드','game-guides'],['자주 묻는 질문','faq'],['사이트 소개','about-us'],['서비스 통계','statistics'],['확률 분석','probability-analysis'],['공정성','fairness-rng'],['주사위 역사','dice-history'],['확률 교육','probability-education'],['개인정보 처리방침','privacy-policy'],['이용약관','terms-of-service'],['면책조항','disclaimer'],['문의·버그·제안','contact']];
const MEMBERS=[{name:'라온',state:'host'},{name:'민지',state:'online'},{name:'준호',state:'offline'},{name:'유진',state:'pending'}];
const RANKS=[{name:'민지',game:'horse',plays:12,wins:6},{name:'준호',game:'horse',plays:10,wins:4},{name:'라온',game:'dice',plays:8,wins:3},{name:'유진',game:'roulette',plays:4,wins:2},{name:'지우',game:'deguri',plays:7,wins:3},{name:'서진',game:'dice',plays:12,wins:3},{name:'하린',game:'horse',plays:9,wins:2},{name:'수빈',game:'roulette',plays:8,wins:2},{name:'도윤',game:'deguri',plays:6,wins:2},{name:'예준',game:'dice',plays:6,wins:1},{name:'시우',game:'horse',plays:5,wins:1},{name:'내 기록',game:'horse',plays:6,wins:0}];
const VEHICLES=[['말',42,12],['토끼',35,9],['로켓',28,8]];
const SKINS=[['light','라이트'],['dark','다크'],['black','블랙'],['midnight','미드나잇'],['mocha','모카'],['purple','퍼플']];
const ownedServerIds=new Set();
let pendingInvite=null;
let isOwner=false,rankView='rank',rankGame='all',rankSort='wins',rankSeason='2',seasonNow='2',calendarMonth=10,volume=60,muted=false,ready=false,orderOpen=true,defaultOrder='아이스 아메리카노',roomScheduled='',rankFocus='',roomFilter='all',roomSearch='';
let orders=[{name:'민지',menu:'아이스 아메리카노'},{name:'준호',menu:'카페라테'}];
let chats=[{name:'민지',text:'점심 먹고 한 판 할까요?',reactions:3,mine:false},{name:'준호',text:'좋아요. 준비됐어요!',reactions:1,mine:false}];
function node(tag,text='',attrs={}){const e=document.createElement(tag);if(text)e.textContent=text;Object.entries(attrs).forEach(([k,v])=>{if(k==='class')e.className=v;else if(k==='value')e.value=v;else e.setAttribute(k,v);});return e;}
function action(text,fn,attrs={}){const b=node('button',text,{type:'button',...attrs});b.onclick=fn;return b;}
function lead(text){return node('p',text,{class:'lead'});}
function outLink(text,path){return node('a',text,{href:SITE+path,target:'_blank',rel:'noopener'});}
function field(label,type,value,attrs={}){const wrap=node('label',label);const input=node('input','',{type,value,...attrs});wrap.append(input);return {wrap,input};}
function select(label,values,current,fn){const wrap=node('label',label),s=node('select');values.forEach(([value,text])=>s.append(node('option',text,{value})));s.value=current;s.onchange=()=>fn(s.value);wrap.append(s);return wrap;}
function tabs(values,current,fn){const t=node('div','',{class:'feature-tabs'});values.forEach(([value,label])=>t.append(action(label,()=>fn(value),{'aria-pressed':String(value===current)})));return t;}
function row(title,sub='',end){const r=node('div','',{class:'feature-row'}),body=node('div','',{class:'grow'});body.append(node('strong',title));if(sub)body.append(node('small',sub,{class:'muted'}));r.append(body);if(end)r.append(end);return r;}
function screen(title){const box=$('extras');box.replaceChildren();show('extras',title);return box;}
function status(text){const p=node('p',text,{class:'feature-status',role:'status'});$('extras').append(p);return p;}
function confirmLocal(title,detail,fn){const box=screen(title);box.append(lead(detail),action('취소',()=>feature('menu')),action('확인',fn,{class:'small-primary'}));}
function syncExtras(){if(!$('manageScope'))return;$('manageScope').hidden=!(member&&scope&&ownedServerIds.has(scope.id));$('ownerState').setAttribute('aria-pressed',String(isOwner));}
function syncRoomExtras(){ready=false;$('readyRoom').textContent='준비';$('startRoom').hidden=!activeRoom?.owned;}
function needServer(title){const box=screen(title);box.append(lead('서버를 고르면 이 모임의 기록과 멤버를 볼 수 있어요.'),action('서버 고르기',()=>{close();entry();}));}
function feature(key){
 if(key==='menu')return menu();if(key==='ranking')return ranking();if(key==='updates')return updates();if(key==='settings')return settings();if(key==='manage')return manage();if(key==='members')return members(false);if(key==='history')return history();if(key==='lobbytools')return lobbyTools();if(key==='chat')return chat();if(key==='orders')return orderPanel();if(key==='participants')return participants();if(key==='roomsettings')return roomSettings();if(key==='gametools')return gameTools();if(key==='roomhistory')return history(true);if(key==='stats')return stats();if(key==='help')return help();if(key==='about')return about();if(key==='contact')return contact();if(key==='invite')return incomingInvite();
}
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-feature]');if(trigger)feature(trigger.dataset.feature);});

function incomingInvite(){const box=screen('초대 링크');box.append(lead('예시 링크로 초대받은 사람의 입장 화면을 확인해요.'),action('열린 방 초대',()=>{close();pickServer(null);requestRoom({...ROOM_EXAMPLES[0],owned:false});}),action('비공개 방 초대',()=>lockedRoom()),action('만료된 초대',()=>{const b=screen('방이 끝났어요');b.append(lead('만료되거나 없는 방이에요.'),action('서버 목록으로',()=>{close();entry();}));}),action('서버 가입이 필요한 초대',()=>{pendingInvite={serverId:'team',room:{...ROOM_EXAMPLES[0],name:'우리팀 한 판',owned:false}};showServers();$('serverMessage').textContent='우리팀 참여 후 초대받은 방으로 이어져요. 예시 참여코드: 2468';}),lead('실제 초대 링크의 서버 권한·비밀번호는 서버에서 확인해요.'));}
function lockedRoom(candidate=null){const box=screen('비공개 방');const f=field('비밀번호','password','',{required:true}),form=node('form');form.append(lead('예시 비밀번호: 1234'),f.wrap,node('button','입장',{type:'submit',class:'small-primary'}));form.onsubmit=e=>{e.preventDefault();if(f.input.value!=='1234'){status('비밀번호가 맞지 않아요.');return;}close();if(!candidate)pickServer(null);requestRoom({... (candidate||ROOM_EXAMPLES[0]),name:candidate?candidate.name:'친구끼리 한 판',owned:false});};box.append(form);}
function stats(){const box=screen('서비스 통계'),grid=node('div','',{class:'stats-grid'});[['오늘 방문','128'],['오늘 플레이','42'],['누적 게임','1,204'],['열린 방','2']].forEach(([k,v])=>{const c=node('div','',{class:'stat-card'});c.append(node('small',k),node('strong',v));grid.append(c);});box.append(lead('목업 예시 수치'),grid,outLink('게임별 통계·최근 게임','/pages/statistics.html'));}
function help(){const box=screen('사용법·도움말');box.append(lead('서버 선택 → 게임 만들기 → 게임 고르기 → 친구 초대'),...LINKS.slice(0,2).map(([label,url])=>outLink(label,'/pages/'+url+'.html')),...[['주사위 규칙','dice-rules-guide'],['경마 규칙','horse-race-guide'],['룰렛 규칙','roulette-guide']].map(([label,url])=>outLink(label,'/pages/'+url+'.html')),node('h3','게임 화면'));GAMES.filter(g=>!g.disabled).forEach(g=>box.append(outLink(g.name,GAME_URLS[g.id])));box.append(action('확률·공정성·서비스 안내',about));}
function about(){const box=screen('소개·서비스 안내');LINKS.forEach(([label,url])=>box.append(outLink(label,'/pages/'+url+'.html')));}
function contact(){const box=screen('문의·버그·제안');box.append(lead('문의 게시판에서 글을 쓰거나, 삭제코드로 내 글을 삭제할 수 있어요. 목업에서는 글을 전송하지 않아요.'),outLink('문의 게시판 열기','/pages/contact.html'));}
$('ownerState').onclick=()=>{isOwner=!isOwner;ownedServerIds.clear();if(isOwner)ownedServerIds.add('lunch');member=true;name=EXAMPLE_NAME;scope=null;storeName();close();entry();};
$('readyRoom').onclick=()=>{ready=!ready;$('readyRoom').textContent=ready?'준비 취소':'준비';};
$('startRoom').onclick=()=>{const box=screen('게임 시작');box.append(lead('이곳은 화면 비교용 목업이에요. 실제 게임은 게임 화면에서 시작할 수 있어요.'),outLink('게임 화면 열기',GAME_URLS[game.id]));};

function requestServerJoin(s){confirmLocal('가입 신청',s.name+'에 참여를 신청할까요? 서버 주인의 승인이 필요해요.',()=>{s.status='pending';showServers();$('serverMessage').textContent='가입 신청을 보냈어요. 승인 대기 중이에요.';});}
function nativeShare(){if(!navigator.share){$('copyStatus').textContent='이 환경에서는 공유 창을 지원하지 않아요. 링크를 복사해 주세요.';return;}navigator.share({title:'LAMDice 예시 초대',url:EXAMPLE_LINK}).then(()=>{$('copyStatus').textContent='공유 창으로 보냈어요.';}).catch(()=>{$('copyStatus').textContent='공유가 취소되었거나 지원되지 않아요. 링크 복사를 이용해 주세요.';});}
$('nativeShare').onclick=nativeShare;
$('serverSearch').oninput=()=>{const q=$('serverSearch').value.trim();[...$('serverList').children].forEach(b=>b.hidden=!b.textContent.includes(q));$('serverMessage').textContent=[...$('serverList').children].some(b=>!b.hidden)?'':'검색 결과가 없어요.';};
/* FEATURE ENGINE END */

entry();
</script>
