<!doctype html>
<html lang="ko" data-theme="dark" data-skin="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>LAMDice · 모바일 메뉴 목업</title>
  <script src="/js/shared/theme-shared.js"></script>
  <script src="/mockups/horse-mobile-theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="/mockups/horse-mobile-theme.css">
  <style>
    /* 독립 메뉴 목업. 설정·꾸미기는 예시 화면 안에서만 바뀐다. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--mobile-canvas); color: var(--mobile-ink); font: 500 14px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; }
    button,textarea { font: inherit; color: inherit; }
    button,a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid var(--mock-emphasis); outline-offset: 3px; }
    h1,h2,p { margin: 0; }
    img { display: block; object-fit: contain; image-rendering: pixelated; }
    .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #mockBar { min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 10px; background: var(--mobile-card); color: var(--mobile-muted); border-bottom: 1px solid var(--mobile-line); font-size: 11px; }
    #mockBar button { min-height: 28px; padding: 3px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--mobile-ink); font-size: 11px; }
    #mockBar button[aria-pressed="true"] { background: var(--mobile-soft); }
    .prototype { max-width: 430px; height: calc(100dvh - 37px); margin: auto; display: flex; flex-direction: column; background: var(--mobile-canvas); }
    .room-head { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; border-bottom: 1px solid var(--mobile-line); flex: none; }
    .icon-button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 1px solid var(--mobile-line); border-radius: 12px; background: var(--mobile-card); color: var(--mobile-ink); text-decoration: none; flex: none; }
    .identity { flex: 1; min-width: 0; }
    .identity small { color: var(--mobile-muted); font-size: 11px; }
    .identity h1 { font-size: 17px; font-weight: 750; letter-spacing: -.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .people-button { width: auto; padding: 0 11px; font-size: 13px; font-weight: 700; }
    button,input,select { font: inherit; color: inherit; }
    .content { flex: 1; min-height: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: auto; overscroll-behavior: contain; }
    .page-head { display: flex; justify-content: space-between; align-items: center; min-height: 44px; flex: none; }
    .page-head h2 { font-size: 24px; letter-spacing: -.8px; }
    .role-badge { padding: 3px 8px; border-radius: 999px; background: var(--mobile-soft); color: var(--mock-emphasis); font-size: 11px; font-weight: 700; }
    .quick-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; flex: none; }
    .quick-action { min-height: 72px; padding: 12px; border: 1px solid var(--mobile-line); border-radius: 16px; background: var(--mobile-card); display: flex; align-items: center; gap: 9px; text-align: left; }
    .tile-icon,.row-icon { width: 32px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--mobile-soft); color: var(--mock-emphasis); }
    .tile-label { font-size: 13px; font-weight: 700; }
    .tile-count { margin-left: auto; color: var(--mobile-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .group { border: 1px solid var(--mobile-line); border-radius: 16px; background: var(--mobile-card); overflow: hidden; flex: none; }
    .menu-row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 12px; border: 0; background: transparent; text-align: left; }
    .group .menu-row + .menu-row { border-top: 1px solid var(--mobile-line); }
    .row-label { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; }
    .row-icon { width: 30px; height: 30px; border-radius: 9px; }
    .row-icon .icon { width: 18px; height: 18px; }
    .trailing { color: var(--mobile-muted); font-size: 11px; }
    .chevron { width: 15px; height: 15px; color: var(--mobile-muted); }
    .theme-select { min-height: 44px; max-width: 110px; padding: 0 2px; border: 0; border-radius: 8px; background: var(--mobile-card); color: var(--mobile-muted); font-size: 12px; }
    .theme-select option { background: var(--mobile-card); color: var(--mobile-ink); }
    .switch { width: 36px; height: 22px; padding: 3px; border-radius: 999px; background: var(--mobile-line); display: flex; align-items: center; flex: none; }
    .switch::before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: var(--mobile-card); }
    [aria-checked="true"] .switch { background: var(--mobile-accent); justify-content: flex-end; }
    [aria-checked="true"] .switch::before { background: var(--mobile-on-accent); }
    .host-row { border: 1px solid var(--mobile-line); border-radius: 16px; background: var(--mobile-card); flex: none; }
    .ad { min-height: 54px; margin-top: auto; display: grid; place-items: center; flex: none; border: 1px dashed var(--mobile-line); border-radius: 10px; color: var(--mobile-muted); font-size: 10px; letter-spacing: 1px; }
    .footer { flex: none; padding: 8px 12px max(8px,env(safe-area-inset-bottom)); border-top: 1px solid var(--mobile-line); background: var(--mobile-canvas); }
    .dock { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .dock button,.dock a { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: transparent; color: var(--mobile-muted); font-size: 10px; text-decoration: none; }
    .dock img,.dock .icon { width: 19px; height: 19px; }
    .dock button[aria-current="page"] { background: var(--mobile-soft); color: var(--mobile-ink); font-weight: 750; }
    dialog { width: min(398px,calc(100% - 24px)); max-height: calc(100dvh - 36px); margin: auto auto 12px; padding: 20px; border: 1px solid var(--mobile-line); border-radius: 20px; background: var(--mobile-card); color: var(--mobile-ink); overflow: auto; }
    dialog::backdrop { background: rgba(var(--shadow-rgb),.65); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .dialog-head h2 { font-size: 20px; letter-spacing: -.6px; }
    .dialog-head .icon-button { border: 0; background: var(--mobile-soft); }
    .person-row { display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid var(--mobile-line); }
    .person-row:last-child { border-bottom: 0; }
    .person-row img { width: 35px; height: 32px; }
    .person-row span { min-width: 0; flex: 1; }
    .person-row small { color: var(--mobile-muted); font-size: 11px; }
    .form-label { display: block; margin: 14px 0 6px; color: var(--mobile-muted); font-size: 12px; }
    .field { width: 100%; min-width: 0; min-height: 48px; border: 1px solid var(--mobile-line); border-radius: 11px; padding: 10px 12px; background: var(--mobile-canvas); font-size: 16px; }
    .field option { background: var(--mobile-card); color: var(--mobile-ink); }
    .primary { min-height: 48px; width: 100%; margin-top: 14px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--mobile-accent); color: var(--mobile-on-accent); font-weight: 750; font-size: 14px; }
    .vehicle-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .vehicle-option { min-height: 84px; padding: 8px; border: 1px solid var(--mobile-line); border-radius: 12px; display: grid; place-items: center; gap: 4px; background: var(--mobile-canvas); font-size: 12px; }
    .vehicle-option img { width: 48px; height: 39px; }
    .vehicle-option[aria-pressed="true"] { background: var(--mobile-soft); border-color: var(--mock-emphasis); box-shadow: inset 0 0 0 1px var(--mock-emphasis); }
    .example { margin: -7px 0 9px; color: var(--mobile-muted); font-size: 11px; }
    .record { display: flex; align-items: center; gap: 10px; min-height: 58px; border-bottom: 1px solid var(--mobile-line); }
    .record:last-child { border-bottom: 0; }
    .record img { width: 35px; height: 30px; }
    .record span { flex: 1; font-size: 13px; }
    .record small { color: var(--mobile-muted); font-size: 11px; }
    .rank-number { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--mobile-soft); color: var(--mock-emphasis); font-size: 14px; }
    .rule { display: flex; align-items: center; gap: 10px; margin-block: 14px; font-size: 14px; }
    .rule .rank-number { flex: none; }
    .toast { position: fixed; z-index: 10; top: 118px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); width: max-content; padding: 9px 15px; border-radius: 999px; background: rgba(var(--shadow-rgb),.8); color: var(--text-on-accent); font-size: 12px; pointer-events: none; }
    @media(min-width:600px) { .prototype { border-inline: 1px solid var(--mobile-line); } }
    @media(max-width:350px) { .room-head { gap: 8px; padding-inline: 12px; } .identity h1 { font-size: 15px; } .content { padding-inline: 12px; gap: 10px; } .quick-actions { gap: 8px; } .quick-action { gap: 7px; padding: 10px; } .tile-label { font-size: 12px; } .tile-count { font-size: 11px; } .tile-icon { width: 28px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation: none !important; transition: none !important; } button:active:not(:disabled) { transform: none; } }
  </style>
</head>

  <script>
    'use strict';
    const PEOPLE = [{name:'나',vehicle:'dinosaur',role:'방장'},{name:'민지',vehicle:'ninja',role:'참여자'},{name:'준호',vehicle:'crab',role:'관전자'},{name:'수빈',vehicle:'rabbit',role:'참여자'}];
    const VEHICLES = [['ninja','닌자'],['crab','게'],['dinosaur','공룡'],['turtle','거북이'],['rabbit','토끼']];
    const HISTORY = [{name:'민지',vehicle:'ninja',detail:'12:40 · 3등'},{name:'나',vehicle:'dinosaur',detail:'12:37 · 1등'},{name:'수빈',vehicle:'rabbit',detail:'12:34 · 3등'}];
    const RANKING = [{name:'민지',score:'2승'},{name:'나',score:'1승'},{name:'수빈',score:'1승'}];
    const GAME_RULES = {dice:['하이·로우·니어 중 규칙을 골라요.','각자 주사위를 한 번 굴려요.','선택한 규칙에 따라 당첨자를 확인해요.'],roulette:['참여자마다 같은 크기의 칸이 생겨요.','돌림판을 돌려요.','화살표가 가리킨 사람이 당첨돼요.'],deguri:['동물을 고르고 준비해요.','1등 또는 꼴등에 투표해요.','선택한 순서로 도착한 동물의 주인이 당첨돼요.']};
    const RULES = GAME_RULES[HorseMobileMockContext.game] || ['탈것을 고르고 준비해요.','당첨 등수에 투표해요.','모두 준비하면 방장이 시작해요.'];
    const TOAST_MS = 2000;
    const $ = id => document.getElementById(id);
    let selectedVehicle = 'dinosaur', guest = false, reservation = 'none', toastTimer;
    function node(tag,cls,text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text !== undefined) el.textContent = text; return el; }
    function sprite(vehicle) { const image = node('img'); image.src = '/assets/horse-race/vehicles/' + vehicle + '/base-idle-1.webp'; image.alt = ''; return image; }
    function notify(text) { clearTimeout(toastTimer); $('toast').textContent = text; $('toast').hidden = false; toastTimer = setTimeout(() => $('toast').hidden = true,TOAST_MS); }
    function panel(title) { $('panelTitle').textContent = title; $('panelBody').replaceChildren(); return $('panelBody'); }
    function openPeople() { const body = panel('참여자 4'); PEOPLE.forEach((p,i) => { const row = node('div','person-row'); row.append(sprite(i === 0 ? selectedVehicle : p.vehicle),node('span','',p.name),node('small','',i === 0 && guest ? '참여자' : p.role)); body.append(row); }); $('panelDialog').showModal(); }
    $('peopleButton').addEventListener('click',openPeople); $('membersButton').addEventListener('click',openPeople);
    $('inviteButton').addEventListener('click',() => { const body = panel('친구 초대'), label = node('label','form-label','목업 링크'), input = node('input','field'), copy = node('button','primary','링크 복사'); label.htmlFor = 'inviteLink'; input.id = 'inviteLink'; input.readOnly = true; input.value = location.origin + HorseMobileMockContext.href('ready'); copy.setAttribute('aria-live','polite'); copy.addEventListener('click',async () => { try { await navigator.clipboard.writeText(input.value); copy.textContent = '복사됨'; } catch (_) { input.focus(); input.select(); copy.textContent = '선택된 링크를 복사해 주세요'; } }); body.append(label,input,copy); $('panelDialog').showModal(); });
    $('soundToggle').addEventListener('click',() => { const enabled = $('soundToggle').getAttribute('aria-checked') !== 'true'; $('soundToggle').setAttribute('aria-checked',String(enabled)); $('soundLabel').textContent = enabled ? '켜짐' : '꺼짐'; });
    document.querySelectorAll('[data-panel]').forEach(button => button.addEventListener('click',() => {
      const key = button.dataset.panel, titles = {customize:'꾸미기',history:'게임 기록',ranking:'랭킹',rules:'게임 규칙'}, body = panel(titles[key]);
      if (key === 'customize') { const grid = node('div','vehicle-grid'); VEHICLES.forEach(([id,label]) => { const choice = node('button','vehicle-option'); choice.setAttribute('aria-pressed',String(id === selectedVehicle)); choice.append(sprite(id),node('span','',label)); choice.addEventListener('click',() => { selectedVehicle = id; $('vehicleLabel').textContent = label; $('panelDialog').close(); notify(label + ' 선택'); }); grid.append(choice); }); body.append(grid); }
      if (key === 'history') { body.append(node('p','example','예시 기록')); HISTORY.forEach(p => { const row = node('div','record'); row.append(sprite(p.vehicle),node('span','',p.name),node('small','',p.detail)); body.append(row); }); }
      if (key === 'ranking') { body.append(node('p','example','예시 순위')); RANKING.forEach((p,i) => { const row = node('div','record'); row.append(node('b','rank-number',String(i + 1)),node('span','',p.name),node('small','',p.score)); body.append(row); }); }
      if (key === 'rules') RULES.forEach((text,i) => { const row = node('p','rule'); row.append(node('b','rank-number',String(i + 1)),node('span','',text)); body.append(row); });
      $('panelDialog').showModal();
    }));
    $('hostButton').addEventListener('click',() => { $('roomName').value = $('roomTitle').textContent; $('reservation').value = reservation; $('hostDialog').showModal(); });
    $('hostForm').addEventListener('submit',e => { e.preventDefault(); const name = $('roomName').value.trim(); if (!name) { $('roomName').value = ''; $('roomName').reportValidity(); return; } $('roomTitle').textContent = name; reservation = $('reservation').value; $('hostButton').querySelector('.trailing').textContent = reservation === 'none' ? '예약' : reservation + '분 후'; $('hostDialog').close(); notify('목업에 반영했어요'); });
    $('guestToggle').addEventListener('click',() => { guest = !guest; $('guestToggle').setAttribute('aria-pressed',String(guest)); $('hostButton').hidden = guest; $('roleBadge').textContent = guest ? '참여자' : '방장'; });
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click',() => b.closest('dialog').close()));
    document.querySelectorAll('dialog').forEach(d => d.addEventListener('click',e => { if (e.target !== d) return; const r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); }));
    $('menuTab').addEventListener('click',() => document.querySelector('.content').scrollTop = 0);
  </script>
</body>
</html>
