<!doctype html>
<html lang="ko" data-theme="dark" data-skin="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>LAMDice · 게임 화면 목업 모음</title><script src="/js/shared/theme-shared.js"></script><script src="/mockups/horse-mobile-theme.js"></script><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"><link rel="stylesheet" href="/mockups/horse-mobile-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--mobile-canvas);color:var(--mobile-ink);font:500 14px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}h1,h2,p{margin:0}a,button{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}img{object-fit:contain;image-rendering:pixelated}#mockBar{min-height:37px;display:flex;justify-content:center;align-items:center;gap:12px;padding:4px 12px;background:var(--mobile-card);border-bottom:1px solid var(--mobile-line);font-size:11px;color:var(--mobile-muted)}main{max-width:1000px;margin:auto;padding:28px 24px 32px}.intro{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--mock-emphasis);font-weight:750}.intro h1{font-size:28px;letter-spacing:-1px;margin:3px 0}.intro p{font-size:12px;color:var(--mobile-muted)}.count{white-space:nowrap;font-size:12px;color:var(--mobile-muted)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.game-card{padding:12px;border:1px solid var(--mobile-line);border-radius:18px;background:var(--mobile-card)}.art{height:140px;border-radius:12px;background:var(--mobile-soft);position:relative;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}.art img{width:76px;height:76px}.art img.small{width:52px;height:52px}.game-title{display:flex;align-items:center;gap:6px;margin:11px 1px 10px}.game-title h2{font-size:17px;letter-spacing:-.5px}.tag{font-size:9px;color:var(--mobile-muted);border:1px solid var(--mobile-line);border-radius:5px;padding:1px 4px}.stage-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stage-links a{min-height:44px;display:grid;place-items:center;border:1px solid var(--mobile-line);border-radius:9px;font-size:12px}.stage-links a:first-child{background:var(--mobile-accent);border-color:var(--mobile-accent);color:var(--mobile-on-accent);font-weight:750}.stage-links a:hover{outline:1px solid var(--mock-emphasis)}:focus-visible{outline:3px solid var(--mock-emphasis);outline-offset:3px}.note{margin-top:22px;color:var(--mobile-muted);font-size:11px}.mini-wheel{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--mobile-accent) 0deg 120deg,var(--mobile-line) 120deg 240deg,var(--mobile-canvas) 240deg);border:3px solid var(--mobile-ink);position:relative}.mini-wheel::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:var(--mobile-card);border:3px solid var(--mobile-ink);inset:0;margin:auto}.wheel-pointer{position:absolute;top:12px;left:calc(50% - 7px);border-inline:7px solid transparent;border-top:13px solid var(--mobile-ink);z-index:1}.mini-die{width:68px;height:68px;display:grid;place-items:center;border-radius:16px;border:2px solid var(--mobile-ink);background:var(--mobile-card);font-size:56px;line-height:1;transform:rotate(-12deg)}.mini-die+div{transform:rotate(15deg) translateY(8px);background:var(--mobile-accent);color:var(--mobile-on-accent)}.horse-art{background:var(--mobile-soft)}.horse-art::after{content:'';position:absolute;left:12px;right:12px;bottom:23px;border-bottom:2px dashed var(--mobile-line)}.horse-art img{z-index:1;width:100px;height:80px}.deguri-art img:first-child{transform:rotate(-14deg) translateY(-13px)}.deguri-art img:last-child{transform:rotate(18deg) translateY(20px)}.deguri-art::after{content:'';position:absolute;width:90px;height:8px;bottom:22px;left:12px;border-radius:6px;background:var(--mobile-line);transform:rotate(-14deg)}
@media(max-width:650px){main{padding:20px 16px 24px}.intro{margin-bottom:16px}.intro h1{font-size:24px}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game-card{padding:10px;border-radius:16px}.art{height:104px}.art img{width:54px;height:54px}.art img.small{width:44px;height:44px}.mini-wheel{width:78px;height:78px}.wheel-pointer{top:6px}.mini-die{width:48px;height:48px;font-size:40px;border-radius:12px}.game-title{margin:9px 0}.game-title h2{font-size:15px}.stage-links{gap:4px}.stage-links a{font-size:11px}.horse-art img{width:78px;height:64px}.count{font-size:11px}.intro p{font-size:11px}}@media(max-width:350px){main{padding-inline:12px}.game-card{padding:8px}.stage-links a{font-size:10px}.game-title h2{font-size:14px}.tag{font-size:8px}.intro h1{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="mockBar"><span>디자인 검토용 · 서비스 미노출</span><button id="themeToggle">테마</button></div><main><header class="intro"><div><span class="eyebrow">LAM DICE / MOBILE</span><h1>게임 화면 목업</h1><p>준비·진행·결과 시안 비교</p></div><span class="count">4 GAMES</span></header><div class="games">
<article class="game-card" data-game="dice"><a class="art" data-stage="ready" aria-label="주사위 준비 목업"><div class="mini-die">⚄</div><div class="mini-die">⚂</div></a><div class="game-title"><h2>주사위</h2></div><nav class="stage-links" aria-label="주사위 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
<article class="game-card" data-game="roulette"><a class="art" data-stage="ready" aria-label="룰렛 준비 목업"><span class="wheel-pointer"></span><div class="mini-wheel"></div></a><div class="game-title"><h2>룰렛</h2></div><nav class="stage-links" aria-label="룰렛 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
<article class="game-card" data-game="horse"><a class="art horse-art" data-stage="ready" aria-label="경마 준비 목업"><img src="/mockups/assets/veh-dinosaur-1.webp" alt=""><img class="small" src="/mockups/assets/veh-rabbit-1.webp" alt=""></a><div class="game-title"><h2>경마</h2></div><nav class="stage-links" aria-label="경마 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
<article class="game-card" data-game="deguri"><a class="art deguri-art" data-stage="ready" aria-label="데구리 준비 목업"><img src="/mockups/assets/mb-hamster-0.webp" alt=""><img src="/mockups/assets/mb-panda-0.webp" alt=""></a><div class="game-title"><h2>데구리</h2><span class="tag">베타</span></div><nav class="stage-links" aria-label="데구리 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
</div><p class="note">목업을 열어보는 목록입니다. 실제 서비스에는 표시되지 않아요.</p></main><script>
(function(){function sync(){const skin=document.documentElement.dataset.skin;document.querySelectorAll('[data-game]').forEach(card=>card.querySelectorAll('[data-stage]').forEach(a=>{const game=card.dataset.game,stage=a.dataset.stage; a.href=game==='horse'?'/mockups/horse-'+({ready:'ready',playing:'racing',result:'result'})[stage]+'-mobile.html?skin='+skin:'/mockups/'+game+'-mobile.html?'+new URLSearchParams({skin,stage});}));}sync();document.addEventListener('mockskinchange',sync);})();
</script></body></html>
