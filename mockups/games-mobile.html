<!doctype html>
<html lang="ko" data-theme="dark" data-skin="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>LAMDice · 게임 화면 목업 모음</title><script src="/js/shared/theme-shared.js"></script><script src="/mockups/horse-mobile-theme.js?v=polish-2"></script><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"><link rel="stylesheet" href="/mockups/horse-mobile-theme.css?v=polish-2"><style>
* { box-sizing:border-box; }
body { margin:0; background:var(--mobile-canvas); color:var(--mobile-ink); font:500 14px/1.5 Pretendard,sans-serif; }
h1,h2,p { margin:0; }
a { color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent; }
img { object-fit:contain; image-rendering:pixelated; }
#mockBar { min-height:37px; display:flex; justify-content:center; align-items:center; gap:12px; padding:4px 12px; background:var(--mobile-card); border-bottom:1px solid var(--mobile-line); font-size:11px; color:var(--mobile-muted); }
main { max-width:960px; margin:auto; padding:32px 24px; }
.intro { display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:24px; }
.eyebrow { font-size:10px; letter-spacing:2px; color:var(--mobile-muted); font-weight:750; }
.intro h1 { font-size:32px; line-height:1.2; letter-spacing:-1.4px; margin:8px 0; }
.intro p { font-size:12px; color:var(--mobile-muted); }
.count { white-space:nowrap; font-size:11px; font-variant-numeric:tabular-nums; color:var(--mobile-muted); border-bottom:2px solid var(--mock-emphasis); padding-bottom:4px; }
.games { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.game-card { display:grid; grid-template-columns:112px minmax(0,1fr); grid-template-rows:auto 44px; gap:12px 16px; padding:12px; border:1px solid var(--mobile-line); border-radius:16px; background:var(--mobile-card); }
.art { grid-row:1 / 3; min-height:112px; border-radius:10px; background:var(--mobile-soft); position:relative; display:flex; align-items:center; justify-content:center; gap:0; overflow:hidden; }
.art img { width:64px; height:64px; }
.art img.small { width:44px; height:44px; }
.game-title { display:flex; align-items:center; gap:8px; align-self:center; }
.game-title h2 { font-size:22px; line-height:1.2; letter-spacing:-.8px; }
.tag { font-size:9px; color:var(--mobile-muted); border:1px solid var(--mobile-line); border-radius:4px; padding:2px 4px; }
.stage-links { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; padding:3px; border:1px solid var(--mobile-line); border-radius:10px; background:var(--mobile-canvas); }
.stage-links a { min-height:38px; display:grid; place-items:center; border-radius:6px; font-size:11px; font-weight:650; }
.stage-links a:first-child { background:var(--mobile-accent); color:var(--mobile-on-accent); font-weight:800; }
.stage-links a:hover { background:var(--mobile-soft); color:var(--mock-emphasis); }
a:active { transform:translateY(1px); }
:focus-visible { outline:3px solid var(--mock-emphasis); outline-offset:3px; }
.note { margin-top:20px; color:var(--mobile-muted); font-size:10px; }
.mini-wheel { width:78px; height:78px; border-radius:50%; background:conic-gradient(var(--mobile-accent) 0deg 120deg,var(--mobile-line) 120deg 240deg,var(--mobile-canvas) 240deg); border:3px solid var(--mobile-ink); position:relative; transform:rotate(-12deg); }
.mini-wheel::after { content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:var(--mobile-card); border:3px solid var(--mobile-ink); inset:0; margin:auto; }
.wheel-pointer { position:absolute; top:11px; left:calc(50% - 6px); border-inline:6px solid transparent; border-top:12px solid var(--mobile-ink); z-index:1; }
.mini-die { width:47px; height:47px; display:grid; place-items:center; flex:none; border-radius:10px; border:2px solid var(--mobile-ink); background:var(--mobile-card); font-size:38px; line-height:1; transform:rotate(-15deg) translateY(-9px); }
.mini-die+div { margin-left:-9px; transform:rotate(15deg) translateY(10px); background:var(--mobile-accent); color:var(--mobile-on-accent); }
.horse-art::after { content:''; position:absolute; left:8px; right:8px; bottom:24px; border-bottom:2px dashed var(--mobile-line); }
.horse-art img { z-index:1; width:70px; height:64px; transform:translate(9px,-9px); }
.horse-art img.small { position:absolute; width:50px; height:50px; right:6px; bottom:8px; transform:none; }
.deguri-art img:first-child { transform:rotate(-14deg) translate(8px,-16px); }
.deguri-art img:last-child { position:absolute; right:3px; bottom:8px; width:54px; height:54px; transform:rotate(18deg); }
.deguri-art::after { content:''; position:absolute; width:56px; height:5px; bottom:24px; left:8px; border-radius:4px; background:var(--mobile-line); transform:rotate(-14deg); }
@media(max-width:720px) { main { max-width:480px; padding:24px 16px; } .games { grid-template-columns:1fr; gap:12px; } .intro { margin-bottom:20px; } .intro h1 { font-size:28px; } .game-card { grid-template-columns:96px minmax(0,1fr); gap:8px 16px; padding:10px; } .art { min-height:104px; } .game-title h2 { font-size:20px; } .stage-links { grid-template-rows:44px; padding:0; gap:0; } .stage-links a { min-height:44px; } }
@media(max-width:350px) { main { padding:20px 12px; } .game-card { grid-template-columns:84px minmax(0,1fr); gap:8px 12px; } .intro h1 { font-size:24px; } .game-title h2 { font-size:18px; } .count { font-size:9px; } .stage-links a { font-size:10px; } }
@media(prefers-reduced-motion:reduce) { * { transition:none!important; } a:active { transform:none; } }
</style></head><body><div id="mockBar"><span>디자인 검토용 · 서비스 미노출</span><button id="themeToggle">테마</button></div><main><header class="intro"><div><span class="eyebrow">LAM DICE / MOBILE</span><h1>게임 화면 목업</h1><p>준비·진행·결과 시안 비교</p></div><span class="count">4 GAMES</span></header><div class="games">
<article class="game-card" data-game="dice"><a class="art" data-stage="ready" aria-label="주사위 준비 목업"><div class="mini-die">⚄</div><div class="mini-die">⚂</div></a><div class="game-title"><h2>주사위</h2></div><nav class="stage-links" aria-label="주사위 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
<article class="game-card" data-game="roulette"><a class="art" data-stage="ready" aria-label="룰렛 준비 목업"><span class="wheel-pointer"></span><div class="mini-wheel"></div></a><div class="game-title"><h2>룰렛</h2></div><nav class="stage-links" aria-label="룰렛 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
<article class="game-card" data-game="horse"><a class="art horse-art" data-stage="ready" aria-label="경마 준비 목업"><img src="/mockups/assets/veh-dinosaur-1.webp" alt=""><img class="small" src="/mockups/assets/veh-rabbit-1.webp" alt=""></a><div class="game-title"><h2>경마</h2></div><nav class="stage-links" aria-label="경마 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
<article class="game-card" data-game="deguri"><a class="art deguri-art" data-stage="ready" aria-label="데구리 준비 목업"><img src="/mockups/assets/mb-hamster-0.webp" alt=""><img src="/mockups/assets/mb-panda-0.webp" alt=""></a><div class="game-title"><h2>데구리</h2><span class="tag">베타</span></div><nav class="stage-links" aria-label="데구리 화면"><a data-stage="ready">준비</a><a data-stage="playing">진행</a><a data-stage="result">결과</a></nav></article>
</div><p class="note">목업을 열어보는 목록입니다. 실제 서비스에는 표시되지 않아요.</p></main><script>
(function(){function sync(){const skin=document.documentElement.dataset.skin;document.querySelectorAll('[data-game]').forEach(card=>card.querySelectorAll('[data-stage]').forEach(a=>{const game=card.dataset.game,stage=a.dataset.stage; a.href=game==='horse'?'/mockups/horse-'+({ready:'ready',playing:'racing',result:'result'})[stage]+'-mobile.html?skin='+skin:'/mockups/'+game+'-mobile.html?'+new URLSearchParams({skin,stage});}));}sync();document.addEventListener('mockskinchange',sync);})();
</script></body></html>
