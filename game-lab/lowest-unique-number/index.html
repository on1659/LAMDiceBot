<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최저 유니크 숫자 게임 — Game Lab</title>
<meta name="description" content="번호를 한 번만 고르면 나머지는 자동으로 진행되는 실시간 멀티플레이어 미니게임 프로토타입 — 아무도 겹치지 않은 가장 낮은 숫자를 낸 사람이 단판으로 우승합니다.">
<meta name="robots" content="noindex, nofollow">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
        background: #0f1117;
        color: #eef0f5;
        padding: 20px 16px 48px;
    }
    a.back {
        display: inline-block;
        margin-bottom: 16px;
        color: #8fa1ff;
        text-decoration: none;
        font-size: 13px;
    }
    header {
        max-width: 520px;
        margin: 0 auto 20px;
        text-align: center;
    }
    header h1 {
        font-size: 22px;
        margin: 0 0 6px;
        background: linear-gradient(135deg, #7c9cff 0%, #b98cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    header p {
        margin: 0;
        color: #9aa1b4;
        font-size: 13px;
        line-height: 1.6;
    }
    main {
        max-width: 520px;
        margin: 0 auto;
    }
    .card {
        background: #171a23;
        border: 1px solid #262b38;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
    }
    label {
        display: block;
        font-size: 13px;
        color: #b6bccb;
        margin-bottom: 6px;
    }
    input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #2c3140;
        background: #0f1117;
        color: #eef0f5;
        font-size: 15px;
        margin-bottom: 14px;
    }
    input[type="text"]:focus {
        outline: 2px solid #7c9cff;
        outline-offset: 1px;
    }
    .row {
        display: flex;
        gap: 10px;
    }
    button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: #0f1117;
        background: #8fa1ff;
        transition: transform 0.1s ease, background 0.15s ease;
    }
    @media (prefers-reduced-motion: reduce) {
        button, .num-btn { transition: none; }
    }
    button:hover { background: #a4b3ff; }
    button:active { transform: translateY(1px); }
    button:disabled {
        background: #3a3f4d;
        color: #7b8296;
        cursor: not-allowed;
    }
    button.secondary {
        background: #262b38;
        color: #eef0f5;
    }
    button.secondary:hover { background: #2f3547; }
    .room-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
    }
    .room-info strong {
        font-size: 20px;
        letter-spacing: 2px;
        color: #8fa1ff;
    }
    #protoPlayerList {
        list-style: none;
        margin: 0 0 4px;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    #protoPlayerList li {
        background: #0f1117;
        border: 1px solid #2c3140;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
    }
    #protoPlayerList li.host { border-color: #ffcf6b; color: #ffcf6b; }
    #protoPlayerList li.me { border-color: #7c9cff; }
    .players-count {
        font-size: 12px;
        color: #6b7284;
        margin-bottom: 8px;
    }
    #errorMsg {
        background: #3a1f24;
        border: 1px solid #6b2a34;
        color: #ff9aa8;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 14px;
    }
    .section-hint {
        font-size: 13px;
        color: #9aa1b4;
        margin: 0 0 14px;
        line-height: 1.6;
    }
    .num-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
    }
    .num-btn {
        min-height: 48px;
        background: #0f1117;
        border: 1px solid #2c3140;
        color: #eef0f5;
        font-size: 17px;
        font-weight: 700;
        border-radius: 10px;
    }
    .num-btn:hover:not(:disabled) { border-color: #7c9cff; }
    .my-number-line {
        font-size: 15px;
        font-weight: 700;
        color: #7cffb0;
        background: #10241c;
        border: 1px solid #1f4a35;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 14px;
    }
    .progress-hint {
        font-size: 12px;
        color: #9aa1b4;
        margin-bottom: 14px;
    }
    .reveal-pulse {
        font-size: 20px;
        font-weight: 800;
        text-align: center;
        margin: 8px 0 16px;
        animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
    }
    @media (prefers-reduced-motion: reduce) {
        .reveal-pulse { animation: none; opacity: 1; }
    }
    .reveal-my-number {
        text-align: center;
        font-size: 14px;
        color: #b6bccb;
    }
    .my-result-line {
        font-size: 20px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 10px;
    }
    .result-summary {
        font-size: 14px;
        color: #b6bccb;
        text-align: center;
        margin-bottom: 14px;
    }
    ul.plain {
        list-style: none;
        margin: 0;
        padding: 0;
    }
    ul.plain li {
        display: flex;
        justify-content: space-between;
        padding: 8px 10px;
        font-size: 13px;
        border-bottom: 1px solid #21252f;
        border-radius: 6px;
    }
    ul.plain li.winner {
        color: #7cffb0;
        font-weight: 700;
        background: rgba(124, 255, 176, 0.08);
    }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<a class="back" href="/game-lab/index.html">← Game Lab으로</a>
<header>
    <h1>최저 유니크 숫자 게임</h1>
    <p>번호를 딱 한 번만 고르세요. 방장이 시작하면 전원의 번호가 동시에 공개되고,<br>아무도 겹치지 않은 가장 낮은 숫자를 낸 사람이 그 자리에서 우승합니다.</p>
</header>

<main>
    <div id="errorMsg" hidden></div>

    <section id="entrySection" class="card">
        <label for="nameInput">닉네임</label>
        <input type="text" id="nameInput" maxlength="20" placeholder="닉네임을 입력하세요">

        <label for="roomCodeInput">방 코드 (참여 시에만 입력)</label>
        <input type="text" id="roomCodeInput" maxlength="4" placeholder="예: AB3D">

        <div class="row">
            <button type="button" style="flex:1" onclick="createRoom()">방 만들기</button>
            <button type="button" class="secondary" style="flex:1" onclick="joinRoom()">참여하기</button>
        </div>
    </section>

    <section id="roomSection" class="card" hidden>
        <div class="room-info">
            <span>방 코드: <strong id="protoRoomCode">----</strong></span>
            <button type="button" class="secondary" onclick="copyRoomCode()">코드 복사</button>
        </div>
        <div class="players-count">참가자 <span id="playerCount">0</span>명</div>
        <ul id="protoPlayerList"></ul>
        <button type="button" class="secondary" onclick="leaveGame()">방 나가기</button>
    </section>

    <section id="gameArea" class="card" hidden>
        <div id="pickPanel">
            <p class="section-hint" id="pickHint"></p>

            <div id="myNumberLine" class="my-number-line" hidden></div>
            <div class="num-grid" id="numberGrid"></div>
            <div class="progress-hint" id="pickProgress"></div>

            <button type="button" id="soloTestBtn" class="secondary" hidden onclick="soloTest()">🤖 혼자 테스트</button>
            <button type="button" id="startGameBtn" hidden onclick="startGame()">게임 시작</button>
        </div>

        <div id="revealingPanel" hidden>
            <div class="reveal-pulse">공개 중...</div>
            <p class="reveal-my-number" id="revealingMyNumber"></p>
        </div>

        <div id="resultPanel" hidden>
            <div class="my-result-line" id="myResultLine"></div>
            <div class="result-summary" id="resultSummary"></div>
            <ul class="plain" id="resultList"></ul>
        </div>
    </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/game-lab/shared/proto-client.js"></script>
<script>
(function () {
    var MIN_PLAYERS = 2; // 서버 socket/proto-games/lowest-unique-number.js의 MIN_PLAYERS와 동일
    var socketReady = false;
    var mySubmittedNumber = null;
    var currentPhase = 'lobby'; // 'lobby' | 'revealing' | 'result'
    var latestPlayerCount = 0;
    var botsSpawned = false; // 🤖 혼자 테스트 중복 실행 방지

    function showError(msg) {
        var el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.hidden = false;
        setTimeout(function () { el.hidden = true; }, 4000);
    }

    function computeMaxNumber(n) {
        return Math.max(1, n) + 2;
    }

    function ensureSocket() {
        if (socketReady) return;
        socketReady = true;
        ProtoClient.init({
            onRoomState: function (room) {
                document.getElementById('playerCount').textContent = room.players.length;
                latestPlayerCount = room.players.length;
                if (currentPhase === 'lobby') renderPickPanel();
            },
            onError: function (message) { showError(message); },
            onDisconnect: function () { showError('서버와 연결이 끊겼습니다.'); }
        });
        var socket = ProtoClient.getSocket();
        socket.on('proto:lowest-unique-number:pickStatus', handlePickStatus);
        socket.on('proto:lowest-unique-number:revealing', handleRevealing);
        socket.on('proto:lowest-unique-number:result', handleResult);
        socket.on('proto:lowest-unique-number:error', function (payload) {
            showError((payload && payload.message) || '오류가 발생했습니다.');
        });
    }

    function enterRoom() {
        document.getElementById('entrySection').hidden = true;
        document.getElementById('roomSection').hidden = false;
        document.getElementById('gameArea').hidden = false;
        currentPhase = 'lobby';
        renderPickPanel();
    }

    window.createRoom = function () {
        var name = document.getElementById('nameInput').value.trim();
        if (!name) { showError('닉네임을 입력하세요.'); return; }
        ensureSocket();
        ProtoClient.createRoom('lowest-unique-number', name, function (res) {
            if (res && res.success) enterRoom();
            else showError((res && res.error) || '방 생성에 실패했습니다.');
        });
    };

    window.joinRoom = function () {
        var name = document.getElementById('nameInput').value.trim();
        var code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
        if (!name || !code) { showError('닉네임과 방 코드를 입력하세요.'); return; }
        ensureSocket();
        ProtoClient.joinRoom(code, name, function (res) {
            if (res && res.success) enterRoom();
            else showError((res && res.error) || '참여에 실패했습니다.');
        });
    };

    window.leaveGame = function () {
        ProtoClient.leaveRoom();
        window.location.reload();
    };

    window.copyRoomCode = function () {
        var code = ProtoClient.getRoomCode();
        if (!code) return;
        if (navigator.clipboard) navigator.clipboard.writeText(code);
    };

    window.startGame = function () {
        ProtoClient.getSocket().emit('proto:lowest-unique-number:start');
    };

    // 호스트 전용: 인원이 MIN_PLAYERS에 못 미칠 때 부족한 만큼 봇을 채워 넣고,
    // 각 봇에게 이 게임의 실제 픽 제출 이벤트를 그대로 태워 유효 범위 내 랜덤 번호를 제출시킨다.
    window.soloTest = function () {
        if (botsSpawned) return;
        var needed = Math.max(0, MIN_PLAYERS - latestPlayerCount);
        if (needed <= 0) return;

        botsSpawned = true;
        renderPickPanel();

        var maxNumber = computeMaxNumber(latestPlayerCount + needed);
        ProtoClient.spawnBots(needed).then(function (bots) {
            bots.forEach(function (bot) {
                var n = 1 + Math.floor(Math.random() * maxNumber);
                bot.socket.emit('proto:lowest-unique-number:pickNumber', { number: n });
            });
        }).catch(function (err) {
            botsSpawned = false;
            renderPickPanel();
            showError((err && err.message) || '테스트 봇 추가에 실패했습니다.');
        });
    };

    window.submitNumber = function (n) {
        if (mySubmittedNumber !== null) return;
        ProtoClient.getSocket().emit('proto:lowest-unique-number:pickNumber', { number: n }, function (res) {
            if (res && res.success) {
                mySubmittedNumber = res.number;
                renderPickPanel();
            } else {
                showError((res && res.error) || '제출에 실패했습니다.');
            }
        });
    };

    function showPanel(id) {
        ['pickPanel', 'revealingPanel', 'resultPanel'].forEach(function (pid) {
            var el = document.getElementById(pid);
            if (el) el.hidden = (pid !== id);
        });
    }

    function renderPickPanel(status) {
        currentPhase = 'lobby';
        var isHost = ProtoClient.getIsHost();
        var maxNumber = computeMaxNumber(latestPlayerCount);

        document.getElementById('pickHint').textContent = isHost
            ? ('번호를 하나 고르세요 (안 골라도 시작하면 자동 배정됩니다). 2명 이상 모이면 시작할 수 있습니다.')
            : '번호를 하나 고르세요. 방장이 시작하면 전원의 번호가 자동으로 동시 공개됩니다.';

        var myNumberLine = document.getElementById('myNumberLine');
        var grid = document.getElementById('numberGrid');
        if (mySubmittedNumber !== null) {
            myNumberLine.hidden = false;
            myNumberLine.textContent = '내 번호: ' + mySubmittedNumber + ' (제출완료, 결과를 기다리는 중)';
            grid.hidden = true;
        } else {
            myNumberLine.hidden = true;
            grid.hidden = false;
            grid.innerHTML = '';
            for (var n = 1; n <= maxNumber; n++) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'num-btn';
                btn.textContent = String(n);
                btn.onclick = (function (num) { return function () { submitNumber(num); }; })(n);
                grid.appendChild(btn);
            }
        }

        document.getElementById('pickProgress').textContent = status
            ? (status.pickedCount + ' / ' + status.totalCount + '명 제출완료')
            : '';

        var startBtn = document.getElementById('startGameBtn');
        startBtn.hidden = !isHost;
        startBtn.disabled = latestPlayerCount < MIN_PLAYERS;

        var soloBtn = document.getElementById('soloTestBtn');
        soloBtn.hidden = !isHost || botsSpawned || latestPlayerCount >= MIN_PLAYERS;

        showPanel('pickPanel');
    }

    function handlePickStatus(status) {
        if (currentPhase === 'lobby') renderPickPanel(status);
    }

    function handleRevealing() {
        currentPhase = 'revealing';
        document.getElementById('revealingMyNumber').textContent = (mySubmittedNumber !== null)
            ? ('내 번호: ' + mySubmittedNumber)
            : '번호를 고르지 않아 자동으로 배정되었습니다.';
        showPanel('revealingPanel');
    }

    function handleResult(result) {
        currentPhase = 'result';
        var myName = ProtoClient.getUserName();
        if (result.submissions && Object.prototype.hasOwnProperty.call(result.submissions, myName)) {
            mySubmittedNumber = result.submissions[myName];
        }

        var isWinner = result.winners.indexOf(myName) !== -1;
        var myLine = document.getElementById('myResultLine');
        if (result.winners.length === 0) {
            myLine.textContent = '결과를 판정할 수 없습니다.';
        } else if (isWinner) {
            myLine.textContent = result.tie ? '🤝 동점 우승!' : '🏆 우승!';
        } else {
            myLine.textContent = '아쉽게 패배했습니다.';
        }

        var summaryEl = document.getElementById('resultSummary');
        if (result.winners.length === 0) {
            summaryEl.textContent = '아무도 결과를 받지 못했습니다.';
        } else if (result.tie) {
            summaryEl.textContent = result.winningNumber + '번이 겹쳐 ' + result.winners.join(', ') + '님 동점 우승';
        } else {
            summaryEl.textContent = result.winners[0] + '님이 ' + result.winningNumber + '번으로 우승';
        }

        var list = document.getElementById('resultList');
        list.innerHTML = '';
        Object.keys(result.submissions)
            .sort(function (a, b) { return result.submissions[a] - result.submissions[b]; })
            .forEach(function (name) {
                var li = document.createElement('li');
                var nameSpan = document.createElement('span');
                nameSpan.textContent = name + (name === myName ? ' (나)' : '');
                var valSpan = document.createElement('span');
                valSpan.textContent = String(result.submissions[name]);
                li.appendChild(nameSpan);
                li.appendChild(valSpan);
                if (result.winners.indexOf(name) !== -1) li.className = 'winner';
                list.appendChild(li);
            });

        showPanel('resultPanel');
    }
})();
</script>
</body>
</html>
