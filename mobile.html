<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="description" content="모임에서 함께 할 게임을 고르고 열린 방에 바로 참여하세요.">
  <title>LAMDice · 게임 로비</title>
  <meta name="google-adsense-account" content="ca-pub-1608259764663412">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1608259764663412" crossorigin="anonymous"></script>
  <script src="/js/shared/theme-shared.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/ui-icons.css">
  <script src="/js/shared/ui-icons.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;display=swap&amp;text=뭘로정할까경마주사위룰렛데구리열린방로그인회원가입게임시작하기%3F">
  <link rel="stylesheet" href="/css/mobile-home.css?v=release-10">
</head>
<body class="mobile-home">
  <div class="mobile-app" hidden>
    <header class="app-head">
      <div class="app-identity">
        <span class="brand"><i class="ui ui-dice" aria-hidden="true"></i>LAMDICE</span>
        <span id="serverTitle">자유 방</span>
      </div>
      <p id="connectionStatus" role="status">연결 중</p>
      <button id="acct" type="button" hidden>로그인</button>
    </header>
    <div class="scroll" id="scroller">
      <main id="s-home">
        <section class="entry-start" aria-labelledby="entryTitle">
          <div class="entry-heading">
            <div class="entry-title-row">
              <h1 id="entryTitle" tabindex="-1">뭘로 정할까?</h1>
              <span id="gameCount"></span>
            </div>
            <p>게임을 고르면 방이 열려요.</p>
          </div>
          <div class="entry-games-wrap">
            <div class="entry-games"></div>
            <button type="button" class="games-arrow games-prev" aria-label="앞 게임 보기" hidden>‹</button>
            <button type="button" class="games-arrow games-next" aria-label="다음 게임 보기" hidden>›</button>
          </div>
        </section>
        <div class="lobby-rail">
          <section class="rooms-block" id="roomsSection" aria-labelledby="roomsTitle">
            <div class="section-head">
              <h2 id="roomsTitle" tabindex="-1">열린 방 <span id="roomCount">0</span></h2>
              <button id="where" class="where" type="button" hidden><span class="sr-only">서버 선택</span><span id="whereName">자유 방</span></button>
            </div>
            <div class="rooms-body">
              <ul id="roomList" class="list"></ul>
              <p id="roomEmpty" class="empty">방을 불러오는 중이에요.</p>
              <div class="room-actions">
                <button id="createGame" class="create" type="button">방 만들기</button>
                <button id="toRooms" class="refresh" type="button"><i class="ui ui-refresh" aria-hidden="true"></i> 새로고침</button>
              </div>
            </div>
          </section>
          <div class="quick-actions">
            <button type="button" data-panel="ranking"><i class="ui ui-trophy" aria-hidden="true"></i>랭킹</button>
            <button type="button" data-panel="history"><i class="ui ui-clock" aria-hidden="true"></i>지난 게임</button>
            <button type="button" data-panel="updates"><i class="ui ui-book" aria-hidden="true"></i>업데이트</button>
          </div>
          <aside class="ad-container mobile-lobby-ad" aria-label="광고">
            <span class="ad-label">AD</span>
            <ins class="adsbygoogle" style="display:block;width:100%;height:50px" data-ad-client="ca-pub-1608259764663412" data-ad-slot="7466418558"></ins>
          </aside>
        </div>
      </main>
    </div>
    <nav class="tabbar" aria-label="로비 메뉴">
      <button type="button" id="navRooms" aria-controls="roomsSection"><i class="ui ui-people" aria-hidden="true"></i>열린 방</button>
      <button type="button" id="navHome" aria-controls="entryTitle" hidden><i class="ui ui-gamepad" aria-hidden="true"></i>게임 선택</button>
      <button type="button" data-panel="menu"><i class="ui ui-list" aria-hidden="true"></i>메뉴</button>
    </nav>
  </div>
  <dialog class="sheet" id="gameSheet" aria-labelledby="gameSheetTitle">
    <div class="panel">
      <div class="panel-head"><h2 id="gameSheetTitle">게임 고르기</h2><button type="button" data-close aria-label="닫기">×</button></div>
      <div class="game-picker"></div>
    </div>
  </dialog>
  <dialog class="sheet" id="nameSheet" aria-labelledby="nameTitle">
    <form class="panel" id="nameForm">
      <div class="panel-head"><h2 id="nameTitle">게임에서 쓸 이름</h2><button type="button" data-close aria-label="닫기">×</button></div>
      <label class="sr-only" for="nameInput">이름</label>
      <input class="txt" id="nameInput" maxlength="8" autocomplete="nickname" enterkeyhint="go" required>
      <button type="submit" class="primary">들어가기</button>
    </form>
  </dialog>
  <dialog class="sheet" id="acctSheet" aria-labelledby="acctTitle">
    <form class="panel" id="acctForm">
      <div class="account-poster">
        <span class="brand"><i class="ui ui-dice" aria-hidden="true"></i>LAMDICE</span>
        <span class="entry-deguri" aria-hidden="true"></span>
      </div>
      <div class="account-fields">
        <div class="panel-head"><h2 id="acctTitle" tabindex="-1">로그인</h2><button type="button" data-close aria-label="닫기">×</button></div>
        <div id="entryAuth">
          <label for="acctName">이름<input class="txt" id="acctName" name="username" maxlength="20" autocomplete="username" enterkeyhint="next" required></label>
          <label for="acctPin">암호코드<input class="txt" id="acctPin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" placeholder="숫자 4~6자리" autocomplete="current-password" required></label>
          <label for="acctPinConfirm" id="pinConfirmLabel" hidden>암호코드 확인<input class="txt" id="acctPinConfirm" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
          <p class="err" id="acctErr" role="alert" hidden></p>
          <button type="submit" class="primary" id="acctGo">로그인</button>
          <button type="button" class="alt" id="acctAlt">처음이면 회원가입</button>
          <button type="button" id="acctGuest" hidden>게스트로 시작</button>
        </div>
        <div id="entryResume" hidden>
          <p class="account-player"><i class="ui ui-person" aria-hidden="true"></i><strong id="entryPlayer"></strong></p>
          <button type="button" class="primary" id="entryContinue">계속하기</button>
          <button type="button" class="alt" id="entrySwitch">계정 전환</button>
        </div>
      </div>
    </form>
  </dialog>
  <dialog class="sheet" id="srvSheet" aria-labelledby="srvTitle">
    <div class="panel">
      <div class="panel-head"><h2 id="srvTitle">어디서 놀까요?</h2><button type="button" data-close aria-label="닫기">×</button></div>
      <label for="serverSearch">서버 찾기</label><input id="serverSearch" type="search" class="txt" placeholder="서버 이름"><ul class="list" id="srvList"></ul>
    </div>
  </dialog>
  <dialog class="sheet" id="passwordSheet" aria-labelledby="passwordTitle">
    <form class="panel" id="passwordForm">
      <div class="panel-head"><h2 id="passwordTitle">비공개 방</h2><button type="button" data-close aria-label="닫기">×</button></div>
      <label for="roomPasswordInput">비밀번호</label><input id="roomPasswordInput" class="txt" type="password" maxlength="20" required>
      <p id="passwordError" class="err" role="alert"></p><button type="submit" class="primary">입장</button>
    </form>
  </dialog>
  <dialog id="dialog" aria-labelledby="dialogTitle">
    <div class="panel-head"><h2 id="dialogTitle"></h2><button id="closeDialog" type="button" aria-label="닫기">×</button></div><div id="panelContent"></div>
  </dialog>
  <template id="gameArt-horse-race">
    <span class="game-art art-race" aria-hidden="true">
      <span class="entry-horse"><img src="/assets/horse-race/vehicles/horse/base-run-1.webp" alt="" width="120" height="90"><img src="/assets/horse-race/vehicles/horse/base-run-2.webp" alt="" width="120" height="90"></span>
      <i class="ui ui-checker"></i>
    </span>
  </template>
  <template id="gameArt-dice">
    <span class="game-art art-dice" aria-hidden="true"><i class="ui ui-dice"></i><i class="ui ui-dice"></i></span>
  </template>
  <template id="gameArt-roulette">
    <span class="game-art art-wheel" aria-hidden="true"><span class="wheel-face"></span></span>
  </template>
  <template id="gameArt-balloon">
    <span class="game-art art-balloon" aria-hidden="true"><span class="balloon-cloud"></span><span class="balloon-cloud"></span><span class="entry-balloon"><span class="balloon-ball"></span><span class="balloon-rider"></span></span></span>
  </template>
  <template id="gameArt-deguri">
    <span class="game-art art-deguri" aria-hidden="true"><span class="entry-deguri"></span></span>
  </template>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared/auth-token-shared.js"></script>
  <script src="/js/shared/ranking-shared.js"></script>
  <script src="/js/mobile-games.js?v=1"></script>
  <script src="/js/mobile-home.js?v=release-5"></script>
  <script src="/js/ads.js"></script>
</body>
</html>
