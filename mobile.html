<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="모임에서 바로 시작하는 주사위, 경마, 룰렛, 데구리"><title>LAMDice · 모바일 모임</title><meta name="google-adsense-account" content="ca-pub-1608259764663412"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1608259764663412" crossorigin="anonymous"></script><script src="/js/shared/theme-shared.js"></script><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/ui-icons.css"><script src="/js/shared/ui-icons.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"><link rel="stylesheet" href="/css/mobile-home.css?v=entry-1"></head>
<body class="mobile-home">
<div class="mobile-app">
  <header class="app-head">
    <div class="app-identity"><span class="brand"><i class="ui ui-dice" aria-hidden="true"></i>LAM<span>DICE</span></span><span id="serverTitle" class="server-label">자유 방</span></div>
    <p id="connectionStatus" class="sub" role="status">연결 중</p>
    <button id="acct" class="avatar" type="button" hidden>로그인</button>
  </header>
  <div class="scroll" id="scroller">
    <main id="s-home">
      <button id="where" class="where" type="button" hidden><span>서버 선택</span><span id="whereName" class="sr-only">자유 방</span></button>
      <section class="entry-start" aria-labelledby="entryTitle">
        <h1 id="entryTitle">뭘로 정할까?</h1>
        <div class="entry-games">
          <button class="tile" type="button" data-game="horse-race"><span class="entry-horse" aria-hidden="true"><img src="/assets/horse-race/vehicles/horse/base-run-1.webp" alt="" width="128" height="96"><img src="/assets/horse-race/vehicles/horse/base-run-2.webp" alt="" width="128" height="96"></span><strong>경마</strong></button>
          <button class="tile" type="button" data-game="dice"><i class="ui ui-dice" aria-hidden="true"></i><strong>주사위</strong></button>
          <button class="tile" type="button" data-game="roulette"><i class="ui ui-slot" aria-hidden="true"></i><strong>룰렛</strong></button>
          <button class="tile" type="button" data-game="deguri"><span class="entry-deguri" aria-hidden="true"></span><strong>데구리</strong></button>
        </div>
      </section>
      <section class="rooms-block" aria-labelledby="roomsTitle">
        <div class="section-head"><h2 id="roomsTitle">열린 방 <span id="roomCount">0</span></h2><button id="createGame" class="create" type="button">게임 만들기 ＋</button></div>
        <ul id="roomList" class="list"></ul><p id="roomEmpty" class="empty">방을 불러오는 중이에요.</p>
        <button id="toRooms" class="refresh" type="button"><i class="ui ui-refresh" aria-hidden="true"></i> 새로고침</button>
      </section>
      <aside class="ad-container mobile-lobby-ad" aria-label="광고"><span class="ad-label">AD</span><ins class="adsbygoogle" style="display:block;width:100%;height:50px" data-ad-client="ca-pub-1608259764663412" data-ad-slot="7466418558"></ins></aside>
      <div class="quick-actions"><button type="button" data-panel="ranking"><i class="ui ui-trophy" aria-hidden="true"></i>랭킹</button><button type="button" data-panel="history"><i class="ui ui-clock" aria-hidden="true"></i>지난 게임</button></div>
      <button class="news" type="button" data-panel="updates"><i class="ui ui-book" aria-hidden="true"></i><span>업데이트</span>›</button>
    </main>
    <main id="s-rooms" hidden></main>
  </div>
  <nav class="tabbar" aria-label="로비 메뉴"><button type="button" id="navHome" hidden><i class="ui ui-home" aria-hidden="true"></i>모임</button><button type="button" id="navServers"><i class="ui ui-people" aria-hidden="true"></i>서버</button><button type="button" data-panel="menu"><i class="ui ui-list" aria-hidden="true"></i>메뉴</button></nav>
</div>
<div class="sheet" id="gameSheet" role="dialog" aria-modal="true" aria-labelledby="gameSheetTitle" hidden><div class="panel"><div class="panel-head"><h2 id="gameSheetTitle">게임 고르기</h2><button type="button" data-close aria-label="닫기">×</button></div><div class="game-picker"><button class="tile" data-game="horse-race"><i class="ui ui-horse" aria-hidden="true"></i>경마</button><button class="tile" data-game="dice"><i class="ui ui-dice" aria-hidden="true"></i>주사위</button><button class="tile" data-game="roulette"><i class="ui ui-slot" aria-hidden="true"></i>룰렛</button><button class="tile" data-game="deguri"><i class="ui ui-paw" aria-hidden="true"></i>데구리</button></div></div></div>
<div class="sheet" id="nameSheet" role="dialog" aria-modal="true" aria-labelledby="nameTitle" hidden><form class="panel" id="nameForm"><div class="panel-head"><h2 id="nameTitle">이름</h2><button type="button" data-close aria-label="닫기">×</button></div><label for="nameInput">게임에서 쓸 이름</label><input class="txt" id="nameInput" maxlength="8" autocomplete="nickname" required><button type="submit" class="primary">들어가기</button></form></div>
<div class="sheet" id="acctSheet" role="dialog" aria-modal="true" aria-labelledby="acctTitle" hidden><form class="panel" id="acctForm"><div class="panel-head"><h2 id="acctTitle">로그인</h2><button type="button" data-close aria-label="닫기">×</button></div><label for="acctName">이름</label><input class="txt" id="acctName" maxlength="20" autocomplete="username" required><label for="acctPin">숫자 암호코드</label><input class="txt" id="acctPin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="current-password" required><label for="acctPinConfirm" id="pinConfirmLabel" hidden>암호코드 확인<input class="txt" id="acctPinConfirm" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><p class="err" id="acctErr" role="alert" hidden></p><button type="submit" class="primary" id="acctGo">로그인</button><button type="button" class="alt" id="acctAlt">처음이면 회원가입</button></form></div>
<div class="sheet" id="srvSheet" role="dialog" aria-modal="true" aria-labelledby="srvTitle" hidden><div class="panel"><div class="panel-head"><h2 id="srvTitle">어디서 놀까요?</h2><button type="button" data-close aria-label="닫기">×</button></div><label for="serverSearch">서버 찾기</label><input id="serverSearch" type="search" class="txt" placeholder="서버 이름"><ul class="list" id="srvList"></ul></div></div>
<div class="sheet" id="passwordSheet" role="dialog" aria-modal="true" aria-labelledby="passwordTitle" hidden><form class="panel" id="passwordForm"><div class="panel-head"><h2 id="passwordTitle">비공개 방</h2><button type="button" data-close aria-label="닫기">×</button></div><label for="roomPasswordInput">비밀번호</label><input id="roomPasswordInput" class="txt" type="password" maxlength="20" required><p id="passwordError" class="err" role="alert"></p><button type="submit" class="primary">입장</button></form></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="panel-head"><h2 id="dialogTitle"></h2><button id="closeDialog" type="button" aria-label="닫기">×</button></div><div id="panelContent"></div></dialog>
<script src="/socket.io/socket.io.js"></script><script src="/js/shared/auth-token-shared.js"></script><script src="/js/shared/ranking-shared.js"></script><script src="/js/mobile-home.js?v=entry-1"></script><script src="/js/ads.js"></script></body></html>
